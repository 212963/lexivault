/* ══════════════════════════════════════════════
   §2  存储层（与 PC 版同名同结构）
   ══════════════════════════════════════════════ */
const DB = (() => {
  let _db = null;
  const STORES = ['words', 'images', 'articles'];
  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise((res, rej) => {
      const req = indexedDB.open('lexivault', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        STORES.forEach(n => {
          if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: 'id' });
        });
      };
      req.onsuccess = () => { _db = req.result; res(_db); };
      req.onerror = () => rej(req.error);
    });
  }
  async function getAll(store) {
    const db = await open();
    return new Promise((res, rej) => {
      const r = db.transaction(store).objectStore(store).getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  }
  async function put(store, val) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(val);
      tx.oncomplete = () => res(val);
      tx.onerror = () => rej(tx.error);
    });
  }
  async function bulkPut(store, arr) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      const os = tx.objectStore(store);
      arr.forEach(v => os.put(v));
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function del(store, id) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async function clear(store) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  return { getAll, put, bulkPut, del, clear, open };
})();

/* ══════════════════════════════════════════════
   §2.5  语音（手机版简化版）
   ══════════════════════════════════════════════ */
const Speech = (() => {
  const synth = window.speechSynthesis;
  let bestVoice = null;
  let lastText = '', lastAt = 0;

  function pickVoice() {
    const voices = synth ? synth.getVoices() : [];
    const en = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    if (!en.length) return false;
    // 优先级：Google > 美式 > 英式 > 其他英文
    const google = en.find(v => /google/i.test(v.name));
    const us = en.find(v => /^en[-_]US/i.test(v.lang));
    const gb = en.find(v => /^en[-_]GB/i.test(v.lang));
    bestVoice = google || us || gb || en[0];
    return true;
  }

  if (synth) {
    pickVoice();
    synth.onvoiceschanged = pickVoice;
    // Android 上首次 getVoices() 可能返回空，稍后自动重试
    let tries = 0;
    const retry = setInterval(() => {
      tries++;
      if (pickVoice() || tries >= 6) clearInterval(retry);
    }, 300);
  }

  function speak(text, { force = false } = {}) {
    if (!synth || !text) return;
    const now = Date.now();
    if (!force && text === lastText && now - lastAt < 300) return;
    lastText = text; lastAt = now;

    if (!bestVoice) pickVoice();

    try {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      if (bestVoice) u.voice = bestVoice;
      // 部分浏览器首次 speak 需要 resume，避免卡住
      setTimeout(() => {
        try { synth.resume(); synth.speak(u); } catch (e) {}
      }, 10);
    } catch (e) {}
  }

  function warmup() {
    if (!synth) return;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.lang = 'en-US';
      if (bestVoice) u.voice = bestVoice;
      synth.speak(u);
    } catch (e) {}
  }

  return { speak, warmup };
})();

/* ══════════════════════════════════════════════
   §2.55  本地词典（CET4，离线，首查加载）
   ══════════════════════════════════════════════ */
const Dict = (() => {
  let _map = null;
  let _loading = null;

  async function load() {
    if (_map) return _map;
    if (_loading) return _loading;
    _loading = fetch('cet4.json?_=' + Date.now(), { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(list => {
        _map = new Map();
        for (const w of list) {
          if (w && w.word) _map.set(String(w.word).toLowerCase(), w);
        }
        console.log('[LexiVault] 本地词典已加载，共', _map.size, '词');
        return _map;
      })
      .catch(e => {
        console.warn('[LexiVault] 本地词典加载失败', e);
        toast('离线词典加载失败，查词会走接口盒子', 'warn');
        _loading = null;
        _map = null;
        throw e;
      });
    return _loading;
  }

  async function lookup(word) {
    if (!_map) {
      try { await load(); } catch (e) { return null; }   // ★ 加载失败就跳过本地，走 API
    }
    if (!word || !_map) return null;
    return _map.get(String(word).trim().toLowerCase()) || null;
  }

  return { load, lookup, getMap: () => _map, isLoaded: () => !!_map };
})();

/* ══════════════════════════════════════════════
   §2.6  数据统计（本地记录调用量 / 流量）
   ══════════════════════════════════════════════ */
const STATS_KEY = 'lexivault.mobile.stats';

const Stats = (() => {
  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function monthKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STATS_KEY) || '{}');
      return {
        cloudUp:   raw.cloudUp   || {},
        cloudDown: raw.cloudDown || {},
        pixabay:   raw.pixabay   || {},
        apihz:     raw.apihz     || {},
      };
    } catch (e) {
      return { cloudUp: {}, cloudDown: {}, pixabay: {}, apihz: {} };
    }
  }
  function save(s) {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function normalize(entry, nowDay, nowMonth) {
    let daily = entry.daily;
    let monthly = entry.monthly;
    if (!daily || daily.date !== nowDay) daily = { date: nowDay, value: 0 };
    if (!monthly || monthly.month !== nowMonth) monthly = { month: nowMonth, value: 0 };
    return { daily, monthly };
  }
  function add(scope, amount) {
    if (!amount || amount <= 0) return;
    const s = load();
    const nowDay = todayKey(), nowMonth = monthKey();
    const b = normalize(s[scope] || {}, nowDay, nowMonth);
    b.daily.value += amount;
    b.monthly.value += amount;
    s[scope] = { daily: b.daily, monthly: b.monthly };
    save(s);
  }
  function getAll() {
    const s = load();
    const nowDay = todayKey(), nowMonth = monthKey();
    const out = {};
    for (const scope of ['cloudUp', 'cloudDown', 'pixabay', 'apihz']) {
      const b = normalize(s[scope] || {}, nowDay, nowMonth);
      out[scope] = { today: b.daily.value, month: b.monthly.value };
    }
    return out;
  }
  return { add, getAll };
})();

/* ══════════════════════════════════════════════
   §2.7  智谱 AI（看图生成例句）
   ══════════════════════════════════════════════ */
const Zhipu = (() => {
  const MODEL = 'glm-4v-flash';

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(fr.error);
      fr.readAsDataURL(blob);
    });
  }

  /* 把返回文本拆成 { en, cn }
     期望格式：第一行英文，第二行中文。格式不对时尽量兜底。 */
  function parseResult(raw) {
    const text = String(raw || '').replace(/\r/g, '').trim();
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
    let en = '', cn = '';
    for (const line of lines) {
      const hasCN = /[\u4e00-\u9fa5]/.test(line);
      if (!en && !hasCN) { en = line; continue; }
      if (en && !cn && hasCN) { cn = line; continue; }
      // 英文和中文挤在同一行 → 用第一个中文字符切开
      if (!en && hasCN) {
        const i = line.search(/[\u4e00-\u9fa5]/);
        if (i > 0) { en = line.slice(0, i).trim(); cn = line.slice(i).trim(); }
      }
    }
    if (!en) return { en: text, cn: '' };
    return { en, cn };
  }

  async function generateSentence(word, imageBlob) {
    const key = S.zhipu.key;
    if (!key) { const e = new Error('未配置智谱 API Key'); e.code = 'NO_KEY'; throw e; }
    if (!word) { const e = new Error('缺少单词'); e.code = 'NO_WORD'; throw e; }
    if (!imageBlob) { const e = new Error('缺少图片'); e.code = 'NO_IMG'; throw e; }
    if (typeof window.__LEXIVAULT_ZHIPU__ !== 'function') {
      const e = new Error('篡改猴代理未加载'); e.code = 'NO_PROXY'; throw e;
    }

    const dataUrl = await blobToDataURL(imageBlob);
    const prompt = `你是英语例句生成助手。请看这张图片，用英文单词"${word}"造一个句子。要求：
1. 英文句子必须包含"${word}"（原形或语法变形都可）
2. 句子要贴合图片的内容
3. 只输出两行，不要任何其他文字、标点引导、Markdown：
第一行：英文句子
第二行：对应中文翻译`;

    const body = {
      model: MODEL,
      messages: [{
        role: 'user',
        content: [
          { type: 'image_url', image_url: { url: dataUrl } },
          { type: 'text', text: prompt }
        ]
      }]
    };

    const resp = await window.__LEXIVAULT_ZHIPU__(key, body);
    if (!resp.ok) {
      let msg = '';
      try { msg = await resp.text(); } catch (err) {}
      throw new Error(`API ${resp.status}: ${String(msg).slice(0, 120)}`);
    }
    const data = await resp.json();
    const content = (data && data.choices && data.choices[0] &&
                     data.choices[0].message && data.choices[0].message.content) || '';
    return parseResult(content);
  }

  return { generateSentence };
})();

function applySettings() {
  const theme = S.settings.theme || 'dark';
  const t = THEMES[theme] || THEMES.dark;
  const r = document.documentElement.style;
  const accent = S.settings.accent || '#7c5cff';
  const accent2 = S.settings.accent2 || '#22d3ee';
  const accentRGB = hexToRgb(accent);
  const accent2RGB = hexToRgb(accent2);
  r.setProperty('--accent', accent);
  r.setProperty('--accent-rgb', accentRGB);
  r.setProperty('--accent2', accent2);
  r.setProperty('--accent2-rgb', accent2RGB);
  r.setProperty('--bg', t.bg);
  r.setProperty('--surface', t.surface);
  r.setProperty('--surface-rgb', hexToRgb(t.surface));
  r.setProperty('--text', t.text);
  r.setProperty('--text-rgb', hexToRgb(t.text));
  r.setProperty('--muted', t.muted);
  r.setProperty('--border', t.border);
  r.setProperty('--shadow', t.shadow);
  r.setProperty('--overlay', t.overlay);
  r.setProperty('--glow-a', `rgba(${accentRGB},${t.glowAAlpha})`);
  r.setProperty('--glow-b', `rgba(${accent2RGB},${t.glowBAlpha})`);
  r.setProperty('--glow-c', `rgba(${accentRGB},${t.glowCAlpha})`);
  document.body.style.background = t.bg;
  // ★ 玻璃主题：给 body 加标记，让专属 CSS 段生效
  document.body.classList.toggle('theme-glass', theme === 'glass');
  // ★ 告诉浏览器本页自主管理颜色，禁止强制反色
  document.documentElement.style.colorScheme = (theme === 'light') ? 'light' : 'dark';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t.bg;
  const csMeta = document.querySelector('meta[name="color-scheme"]');
  if (csMeta) csMeta.content = (theme === 'light') ? 'light dark' : 'dark light';
}

function refreshThemeButtons() {
  const cur = S.settings.theme || 'dark';
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.theme === cur);
  });
}
const SETTINGS_KEY = 'lexivault.mobile.settings';

function loadSettings() {
  try {
    return Object.assign({}, DEFAULT_SETTINGS,
      JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'));
  } catch (e) { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(S.settings)); } catch (e) {}
}

/* 图片 URL 缓存 */
function imgURL(id) {
  if (!id) return null;
  if (S.urls.has(id)) return S.urls.get(id);
  const im = S.images.find(i => i.id === id);
  if (!im || !im.blob) return null;
  const u = URL.createObjectURL(im.blob);
  S.urls.set(id, u);
  return u;
}

const VIEW_META = {
  create:  ['新建单词', '把图片和单词绑定'],
  library: ['总词库',   '管理你的单词'],
  test:    ['测试',     '检验记忆效果'],
  lookup:  ['查词',     '搜索手机里的单词'],
};

function switchView(name) {
  if (!VIEW_META[name]) return;
  // 切换视图时清理测试卡的 Enter 监听
  if (typeof _learnEnterHandler !== 'undefined' && _learnEnterHandler) {
    document.removeEventListener('keydown', _learnEnterHandler);
    _learnEnterHandler = null;
  }
  S.view = name;
  // ★ 切页时强制关闭详情页，避免残留遮挡
  const _ws = document.getElementById('wordSheet');
  if (_ws) _ws.classList.remove('open');
  $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  const [t, sub] = VIEW_META[name];
  $('#viewTitle').textContent = t;
  $('#viewSub').textContent = sub;
  window.scrollTo(0, 0);
  if (name === 'lookup') renderLookup();
  if (name === 'library') renderLibrary();
  if (name === 'test') renderTestHome();
  if (typeof updateExitButton === 'function') updateExitButton();
}

const POS_LIST = [
  { v:'',     l:'（无）' },
  { v:'n.',   l:'n. 名' },
  { v:'v.',   l:'v. 动' },
  { v:'vt.',  l:'vt. 及物动' },
  { v:'vi.',  l:'vi. 不及物动' },
  { v:'aux.', l:'aux. 助动' },
  { v:'adj.', l:'adj. 形' },
  { v:'adv.', l:'adv. 副' },
  { v:'prep.',l:'prep. 介' },
  { v:'conj.',l:'conj. 连' },
  { v:'pron.',l:'pron. 代' },
  { v:'num.', l:'num. 数' },
  { v:'art.', l:'art. 冠' },
  { v:'int.', l:'int. 感' },
  { v:'det.', l:'det. 限定' },
  { v:'abbr.',l:'abbr. 缩' },
  { v:'phr.', l:'phr. 短语' },
];

/* 生成词性下拉选项：常列表 + 未知词性 fallback */
function buildPosOptions(currentPos) {
  const cur = (currentPos || '').trim();
  const list = POS_LIST.slice();
  if (cur && !list.some(p => p.v === cur)) {
    list.push({ v: cur, l: cur });
  }
  return list.map(p =>
    `<option value="${esc(p.v)}" ${p.v === cur ? 'selected' : ''}>${esc(p.l)}</option>`
  ).join('');
}

const C = {
  word: '',
  meanings: [{ pos: '', text: '' }],
  phonetic: '',
  category: '',
  sentence: '',
  imageIds: [],
};

  renderCreateMeanings();

function renderCreateMeanings() {
  const wrap = $('#meaningsList');
  if (!wrap) return;
  const list = C.meanings;
  wrap.innerHTML = list.map((m, i) => `
    <div class="meaning-row" data-i="${i}">
      <select class="pos-select" data-i="${i}">
        ${buildPosOptions(m.pos)}
      </select>
      <input class="meaning-input" data-i="${i}" value="${esc(m.text || '')}"
             placeholder="${i === 0 ? '例如：苹果' : '另一个意思…'}"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      ${list.length > 1 ? `<button type="button" class="remove-mean" data-i="${i}" title="删除">✕</button>` : ''}
    </div>
  `).join('');

  $$('.pos-select', wrap).forEach(sel => {
    sel.onchange = e => { C.meanings[+e.target.dataset.i].pos = e.target.value; };
  });
  $$('.meaning-input', wrap).forEach(inp => {
    inp.oninput = e => { C.meanings[+e.target.dataset.i].text = e.target.value; };
  });
  $$('.remove-mean', wrap).forEach(btn => {
    btn.onclick = e => {
      C.meanings.splice(+e.target.dataset.i, 1);
      if (!C.meanings.length) C.meanings.push({ pos: '', text: '' });
      renderCreateMeanings();
    };
  });
}

function renderCreateImages() {
  const wrap = $('#createImgGrid');
  if (!wrap) return;
  if (!C.imageIds.length) {
    wrap.innerHTML = '<div class="img-empty">还没有绑定图片</div>';
    return;
  }
  wrap.innerHTML = C.imageIds.map(id => {
    const url = imgURL(id);
    return `<div class="img-cell">
      <img src="${url}" alt="">
      <button type="button" class="img-remove" data-id="${id}" title="移除">✕</button>

    };

}

/* 图片压缩（手机端最大 1200px，质量 0.85） */
async function compressImage(file, max = 1200, quality = 0.85) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 500 * 1024) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    return blob || file;
  } catch (e) {
    console.warn('压缩失败，使用原图', e);
    return file;
  }
}

/* 从 File[] 添加图片到 S.images + IndexedDB */

let _learnEnterHandler = null;

function memoryRateOf(word) {
  const r = retentionOf(word);
  return r === null ? 0 : r;
}

function retentionOf(word, at = nowMs()) {
  if (!word.srs) return null;
  // 初始记忆率：新字段 baseRetention，老数据兼容 learnProgress
  const base = (word.srs.baseRetention !== undefined)
    ? word.srs.baseRetention
    : (word.srs.learnProgress || 0);
  if (!base || base <= 0) return null;              // 没学过
  if (!word.srs.lastReview) return base;            // 刚学完还没开始衰减
  const days = (at - word.srs.lastReview) / DAY;
  const st = Math.max(0.1, word.srs.strength || S.settings.srsInit);
  return Math.min(1, base * Math.exp(-days / st));
}
/* 学习进度：0 ~ 1。
   - 4 个环节全做完才结算，进度 = 1 − 首轮答错次数 × 0.25
   - 中途退出 → 0（下次重新学）
   - 老词兼容：没记录过 learnProgress 的，只有 reviews >= 4 条
     （说明完整走过一遍 4 环节）才算学完，否则视为未学习 */
function learningProgressOf(word) {
  if (!word.srs) return 0;
  if (word.srs.learnProgress === undefined) return 0;   // 没记录 = 未学习
  return word.srs.learnProgress;
}
/* 学习进度对应的颜色：绿=学完 / 橙=学过但没全对 / 灰=未开始 */
function progColor(p) {
  if (p >= 1) return '#3ddc97';
  if (p > 0)  return '#ffb43c';
  return '#8b8ba7';
}
function gradeWord(word, ok, opts = {}) {
  if (!word.srs) word.srs = { strength: S.settings.srsInit, lastReview: null, reviews: [] };

  if (opts.review) {
    // ── 复习模式：按题型独立 +25%，答错不动 ──
    if (ok && opts.addProgress !== false) {
      const base = word.srs.baseRetention !== undefined
        ? word.srs.baseRetention
        : (word.srs.learnProgress || 0);
      word.srs.baseRetention = Math.min(1, base + 0.25);
      word.srs.learnProgress = word.srs.baseRetention;
      word.srs.lastReview = nowMs();
    }
    // 答对但该题型本次已加过 / 答错：什么都不动
  } else {
    if (ok) word.srs.strength = Math.min(word.srs.strength * S.settings.srsGain + 0.4, 365);
    else word.srs.strength = Math.max(0.2, word.srs.strength * S.settings.srsDecay);
    word.srs.lastReview = nowMs();
  }

  word.srs.reviews.push({ t: nowMs(), ok });
  if (word.srs.reviews.length > 60) word.srs.reviews.shift();
  word.updatedAt = nowMs();
  DB.put('words', word);
}
function getMeanings(word) {
  if (word.meanings && Array.isArray(word.meanings) && word.meanings.length) return word.meanings;
  if (word.meaning) return [{ pos: '', text: word.meaning }];
  return [];
}
/* 词性补点：n → n. / vt → vt.；已有点的保持不变 */
function formatPos(p) {
  const s = String(p || '').trim();
  if (!s) return '';
  return /\.$/.test(s) ? s : s + '.';
}

function meaningsToString(arr) {
  return (arr || []).filter(m => m && m.text && m.text.trim())
    .map(m => (m.pos ? `[${m.pos}] ` : '') + m.text.trim())
    .join('；');
}
/* 判断某条 meaning 是否为词组（pos 是 phr. / phrase 等） */
function isPhraseMeaning(m) {
  if (!m || !m.pos) return false;
  const p = String(m.pos).toLowerCase().replace(/\.$/, '');
  return p === 'phr' || p === 'phrase' || p === 'phrases';
}
/* 从 meanings 里挑出词组，切分成字符串数组
   ⚠ 词组之间是「；」，但词组内部的多释义也用「；」（如 "on high: 在高处；在天空"）
   区分方式：只有「；」后面紧跟「英文单词 + 冒号」的才是新词组 */
function splitWordPhrases(word) {
  const arr = [];
  const SPLIT_RE = /[；;](?=[A-Za-z][A-Za-z\s\-'’]{0,40}[:：])/;
  for (const m of getMeanings(word)) {
    if (!isPhraseMeaning(m)) continue;
    String(m.text || '').split(SPLIT_RE).forEach(s => {
      const t = s.trim();
      if (t) arr.push(t);
    });
  }
  return arr;
}
/* 把词的例句拆成"每句一行英文 + 中文"的字符串数组
   兼容两种数据格式：
     ① PC 端格式：sentence 是英文，sentenceZh 是中文，按行索引一一配对
     ② 手机端旧格式：sentence 里 "英文\n中文" 或 "英文 中文"
   输出统一为 "英文  中文" 拼接的单行字符串 */
function splitWordSentences(word) {
  if (!word) return [];
  const enRaw = String(word.sentence || '').trim();
  const zhRaw = String(word.sentenceZh || '').trim();

  // ① PC 端格式：sentenceZh 存在 → 按行配对
  if (zhRaw) {
    const enLines = enRaw ? enRaw.split('\n').map(s => s.trim()).filter(Boolean) : [];
    const zhLines = zhRaw.split('\n').map(s => s.trim()).filter(Boolean);
    const n = Math.max(enLines.length, zhLines.length);
    const out = [];
    for (let i = 0; i < n; i++) {
      const en = enLines[i] || '';
      const cn = zhLines[i] || '';
      if (!en && !cn) continue;
      if (en && cn) out.push(en + '  ' + cn);
      else out.push(en || cn);
    }
    return out;
  }

  // ② 手机端旧格式
  if (!enRaw) return [];
  const lines = enRaw.split('\n').map(s => s.trim()).filter(Boolean);
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const cur = lines[i];
    const next = lines[i + 1];
    const curHasCN = /[\u4e00-\u9fa5]/.test(cur);
    const nextHasCN = next ? /[\u4e00-\u9fa5]/.test(next) : false;
    if (!curHasCN && next && nextHasCN) {
      out.push(cur + '  ' + next);
      i += 2;
    } else {
      out.push(cur);
      i += 1;
    }
  }
  return out;
}
/* 把"英文 中文"一行拆成 {en, cn} */
function splitSentenceLine(line) {
  const s = String(line || '').trim();
  const m = s.match(/^([\s\S]*?)([\u4e00-\u9fa5][\s\S]*)$/);
  if (m) return { en: m[1].trim(), cn: m[2].trim() };
  return { en: s, cn: '' };
}
/* 把例句里的目标单词用 .hl-word 包起来（大小写不敏感，只匹配完整单词）
   返回已经 esc 过的 HTML 片段 */
/* 把例句里的目标单词（及其常见形态变化）用 .hl-word 包起来
   - 长度 ≥ 4：按词干匹配，assist 也能高亮 assisting / assists / assisted / assistance
     · 结尾 e 的额外补去 e 版本：care → caring / cared
     · 结尾「辅音 + y」的额外补 y→i 版本：study → studies / studied
   - 长度 ≤ 3：只精确匹配，避免 is 误伤 issue、a 误伤 about */
function highlightWordInText(text, word) {
  const raw = String(text || '');
  const w = String(word || '').trim();
  if (!raw) return '';
  if (!w) return esc(raw);

  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const low = w.toLowerCase();
  const safe = escRe(low);

  let re;
  if (low.length < 4) {
    re = new RegExp(`\\b${safe}\\b`, 'gi');
  } else {
    const alts = [safe];                       // 原词干
    if (low.endsWith('e')) {                   // care → caring / cared
      const stem = escRe(low.slice(0, -1));
      alts.push(stem + 'ing');
      alts.push(stem + 'ed');
    }
    if (low.endsWith('y') && low.length > 1 && !'aeiou'.includes(low[low.length - 2])) {
      const stem = escRe(low.slice(0, -1));    // study → studies / studied
      alts.push(stem + 'ies');
      alts.push(stem + 'ied');
    }
    const pattern = alts.map(a => `${a}[a-z]*`).join('|');
    re = new RegExp(`\\b(?:${pattern})\\b`, 'gi');
  }

  const parts = [];
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    if (m.index > last) parts.push(esc(raw.slice(last, m.index)));
    parts.push(`<span class="hl-word">${esc(m[0])}</span>`);
    last = re.lastIndex;
  }
  if (last < raw.length) parts.push(esc(raw.slice(last)));
  return parts.join('');
}
/* 把例句渲染成 HTML：目标词（含词形变化）高亮、其余单词可点击查词 */
function renderClickableSentence(text, targetWord) {
  const raw = String(text || '');
  if (!raw) return '';
  const targetLow = String(targetWord || '').trim().toLowerCase();
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // 1. 先找出目标词（含词形变化）在原句里的位置区间
  let targetRe = null;
  if (targetLow) {
    if (targetLow.length < 4) {
      targetRe = new RegExp(`\\b${escRe(targetLow)}\\b`, 'gi');
    } else {
      const safe = escRe(targetLow);
      const alts = [safe];
      if (targetLow.endsWith('e')) {
        const stem = escRe(targetLow.slice(0, -1));
        alts.push(stem + 'ing', stem + 'ed');
      }
      if (targetLow.endsWith('y') && targetLow.length > 1 && !'aeiou'.includes(targetLow[targetLow.length - 2])) {
        const stem = escRe(targetLow.slice(0, -1));
        alts.push(stem + 'ies', stem + 'ied');
      }
      targetRe = new RegExp(`\\b(?:${alts.map(a => a + '[a-z]*').join('|')})\\b`, 'gi');
    }
  }
  const targetRanges = [];
  if (targetRe) {
    let mm;
    while ((mm = targetRe.exec(raw)) !== null) {
      targetRanges.push([mm.index, mm.index + mm[0].length]);
    }
  }

  // 2. 遍历英文单词，目标词用 hl-word，其余用 glance-word
  const wordRe = /\b[A-Za-z][A-Za-z'-]*\b/g;
  const parts = [];
  let last = 0, m;
  while ((m = wordRe.exec(raw)) !== null) {
    const start = m.index, end = start + m[0].length;
    if (start > last) parts.push(esc(raw.slice(last, start)));
    const isTarget = targetRanges.some(([s, e]) => start >= s && end <= e);
    if (isTarget) {
      parts.push(`<span class="hl-word">${esc(m[0])}</span>`);
    } else {
      parts.push(`<span class="glance-word" data-w="${esc(m[0])}">${esc(m[0])}</span>`);
    }
    last = end;
  }
  if (last < raw.length) parts.push(esc(raw.slice(last)));
  return parts.join('');
}

/* 轻量词形还原：carrying → carry / carrying / carrie…；studied → study / studie… */
function guessLemma(word) {
  const low = String(word || '').toLowerCase().trim();
  if (!low) return [];
  const out = [low];
  if (low.endsWith('ies') && low.length > 4) out.push(low.slice(0, -3) + 'y');
  if (low.endsWith('es')  && low.length > 3) out.push(low.slice(0, -2));
  if (low.endsWith('s')   && low.length > 3) out.push(low.slice(0, -1));
  if (low.endsWith('ing') && low.length > 5) {
    const stem = low.slice(0, -3);
    out.push(stem, stem + 'e');
    if (stem.length > 2 && stem[stem.length - 1] === stem[stem.length - 2]) {
      out.push(stem.slice(0, -1));
    }
  }
  if (low.endsWith('ed') && low.length > 4) {
    const stem = low.slice(0, -2);
    out.push(stem, stem + 'e');
    if (stem.length > 2 && stem[stem.length - 1] === stem[stem.length - 2]) {
      out.push(stem.slice(0, -1));
    }
    if (stem.endsWith('i')) out.push(stem.slice(0, -1) + 'y');
  }
  if (low.endsWith('est') && low.length > 5) out.push(low.slice(0, -3));
  if (low.endsWith('er')  && low.length > 4) out.push(low.slice(0, -2));
  if (low.endsWith('ly')  && low.length > 4) out.push(low.slice(0, -2));
  return [...new Set(out)];   // 去重
}

/* 点例句里的单词 → 本地词库 → 离线词典 → 接口盒子 → 弹窗显示 */
async function showWordGlance(raw) {
  const original = String(raw || '').trim();
  if (!original) return;
  const cands = guessLemma(original);

  // 1. 本地词库
  for (const c of cands) {
    const w = S.words.find(x => (x.text || '').toLowerCase() === c);
    if (w) { openLookupDetail(w); return; }
  }

  const modal = $('#lookupDetailModal');
  if (modal) {
    $('#lookupDetailBody').innerHTML =
      `<div class="lookup-tip"><div class="big">⏳</div>正在查询「${esc(original)}」…</div>`;
    modal.hidden = false;
    pushModalHistory('lookupDetailModal');
  }

  // 2. 离线词典
  for (const c of cands) {
    try {
      const entry = await Dict.lookup(c);
      if (entry) { openDictDetail(entry); return; }
    } catch (e) {}
  }

  // 3. 接口盒子
  if (S.apiHz.id && S.apiHz.key) {
    for (const c of cands) {
      try {
        const info = await fetchWordInfoFromApiHz(c);
        if (info && info.meanings && info.meanings.length) {
          openDictDetail({
            word: c,
            phonetic: info.phonetic || '',
            meanings: info.meanings,
            phrases: info.phrases || [],
          });
          return;
        }
      } catch (e) {}
    }
  }

  // 4. 都查不到
  if (modal) {
    $('#lookupDetailBody').innerHTML = `
      <div class="lookup-tip">
        <div class="big">🤔</div>
        没有找到「${esc(original)}」的释义
      </div>
      <button class="btn block lg" id="glanceCloseBtn" style="margin-top:10px">关闭</button>`;
    modal.hidden = false;
    pushModalHistory('lookupDetailModal');
    const btn = $('#glanceCloseBtn');
    if (btn) btn.onclick = () => { closeModal('lookupDetailModal'); };
  }
}

/* 测试中「💡 提示」→ 在题目卡里显示"挖空版例句" */
function showHintSentence(word, blank = true) {

    text = en.replace(new RegExp(safe, 'gi'), '_____');

/* 保存时把"例句框文本"拆成 { sentence, sentenceZh } 两个字段（与 PC 端对齐）
   输入格式：
     ① "英文\n中文"（智谱生成，最常用）
     ② "英文 中文"（一行）
     ③ 只有英文 / 只有中文
   规则：每行里第一个中文字符是分界点，左边归英文，右边归中文 */
function splitSentenceFieldForSave(raw) {
  const lines = String(raw || '').split('\n').map(s => s.trim()).filter(Boolean);
  const ens = [], zhs = [];
  for (const line of lines) {
    const i = line.search(/[\u4e00-\u9fa5]/);
    if (i < 0) { ens.push(line); continue; }
    if (i === 0) { zhs.push(line); continue; }
    const en = line.slice(0, i).trim();
    const cn = line.slice(i).trim();
    if (en) ens.push(en);
    if (cn) zhs.push(cn);
  }
  return { sentence: ens.join('\n'), sentenceZh: zhs.join('\n') };
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── 词库可视化圆环：三段（已学习 / 待复习 / 未学习） ── */
const RING_CIRC = 2 * Math.PI * 78;   // ≈ 490.09

function renderRing() {
  const total = S.words.length;

  // 分类统计（按「记忆保留率」分：没学过 / 学过但衰减到 80% 以下 / 学过且还稳）
  let learned = 0, review = 0, fresh = 0;
  for (const w of S.words) {
    if (learningProgressOf(w) <= 0) { fresh++; continue; }
    const r = memoryRateOf(w);
    if (r >= 0.8) learned++;
    else review++;
  }

  // 中心数字 + 图例
  const rt = $('#ringTotal');        if (rt) rt.textContent = total;
  const rl = $('#ringLearnedNum');   if (rl) rl.textContent = learned;
  const rr = $('#ringReviewNum');    if (rr) rr.textContent = review;
  const rn = $('#ringNewNum');       if (rn) rn.textContent = fresh;

  // 三段长度与起点
  const ratioL = total ? learned / total : 0;
  const ratioV = total ? review  / total : 0;
  const ratioN = total ? fresh   / total : 0;
  const lenL = ratioL * RING_CIRC;
  const lenV = ratioV * RING_CIRC;
  const lenN = ratioN * RING_CIRC;

  // 应用（先重置为 0 → 下一帧设真实值，触发 CSS transition）
  applyRingSeg('#ringSegLearned', lenL, 0,              0);
  applyRingSeg('#ringSegReview',  lenV, lenL,           150);
  applyRingSeg('#ringSegNew',     lenN, lenL + lenV,    300);
}

function applyRingSeg(sel, len, start, delayMs) {
  const el = $(sel);
  if (!el) return;
  el.style.transition = 'none';
  el.style.strokeDasharray = `0 ${RING_CIRC}`;
  el.style.strokeDashoffset = String(-start);
  // ★ 用两帧 requestAnimationFrame 代替强制回流，
  //   避免同步布局阻塞主线程；圆环动画效果不变，只是慢一两帧。
  requestAnimationFrame(() => {
    el.style.transition = '';
    el.style.transitionDelay = delayMs + 'ms';
    requestAnimationFrame(() => {
      el.style.strokeDasharray = `${len} ${RING_CIRC}`;
    });
  });
}

/* ── 测试首页：统计未学习 / 待复习 ── */
function renderTestHome() {
  // 未学习：有图 + 从没学过

/* 返回 [{word, imgId}, ...]：1 个正确 + 3 个干扰，各带自己的单词对象
   （用于图片底部显示对应释义） */
function buildOptions(word) {
  const others = S.words.filter(x => x.id !== word.id && x.imageIds && x.imageIds.length);
  const used = new Set(word.imageIds);
  const opts = [{ word, imgId: word.imageIds[0] }];
  for (const o of shuffle(others)) {
    const iid = o.imageIds[0];
    if (used.has(iid)) continue;
    used.add(iid);
    opts.push({ word: o, imgId: iid });
    if (opts.length === 4) break;
  }
  return shuffle(opts);
}

/* 复习选择题：1 个正确释义 + 3 个从词库随机抽的干扰释义
   每个选项拆成 { pos, text }，方便渲染成"词性一行 + 释义一行" */
function buildReviewOptions(word) {
  // 从一条 meaning 里抽出 { pos, text }，优先选非词组的
  const pickMeaning = w => {
    const plain = getMeanings(w).filter(m => !isPhraseMeaning(m) && m.text && m.text.trim());
    if (plain.length) return { pos: formatPos(plain[0].pos), text: plain[0].text.trim() };
    const any = getMeanings(w).filter(m => m.text && m.text.trim());
    if (any.length) return { pos: formatPos(any[0].pos), text: any[0].text.trim() };
    return { pos: '', text: '（无释义）' };
  };

  const correct = pickMeaning(word);
  const opts = [{ pos: correct.pos, text: correct.text, correct: 1 }];
  const used = new Set([correct.text]);

  for (const o of shuffle(S.words)) {
    if (o.id === word.id) continue;
    const m = pickMeaning(o);
    if (!m.text || used.has(m.text)) continue;
    used.add(m.text);
    opts.push({ pos: m.pos, text: m.text, correct: 0 });
    if (opts.length === 4) break;
  }
  return shuffle(opts);
}
/* ══════════════════════════════════════════════
   Learn 流程：未学习词分批学习
   ══════════════════════════════════════════════ */
const LEARN_BATCH_SIZE = 10;
/* 学习阶段的 5 步，顺序不能改 */
const LEARN_STAGES = ['example', 'choice-zh', 'choice', 'self-sentence', 'spell', 'reverse'];

function getEnabledStages() {
  const st = Object.assign({
    example: true, 'choice-zh': true, choice: true,
    'self-sentence': true, spell: true, reverse: true
  }, S.settings.testStages || {});
  return LEARN_STAGES.filter(s => st[s] !== false);
}

function getUnlearnedWords() {
  return S.words.filter(w => w.imageIds && w.imageIds.length &&
    learningProgressOf(w) <= 0);
}

function buildLearnSession() {
  const pool = getUnlearnedWords();
  if (!pool.length) return null;

  // 10 词一组
  const batches = [];
  for (let i = 0; i < pool.length; i += LEARN_BATCH_SIZE) {
    batches.push(pool.slice(i, i + LEARN_BATCH_SIZE));
  }

  // ★ 直接构建第一批任务（不能调 buildBatchTasks：它读的是 T.batches，此刻还没赋值）
  const firstBatch = batches[0] || [];
  const tasks = [];
  const stages = getEnabledStages();
  for (const stage of stages) {
    for (const word of firstBatch) {
      tasks.push({ word, stage });
    }
  }

  return {
    batches,
    tasks,
    wordPool: pool,
  };
}

function startLearn() {
  const session = buildLearnSession();
  if (!session || !session.tasks.length) {
    return toast('没有可学习的单词', 'warn');
  }

  T.mode = 'learn';
  T.phase = 'learn';
  T.batches = session.batches;
  T.batchIdx = 0;
  T.tasks = buildBatchTasks(0);               // ★ 只装第一批
  T.taskIdx = 0;
  T.round = 1;
  T.roundWrong = [];
  T.firstRoundTotal = 0;                      // 拼写阶段才算正确率
  T.firstRoundCorrect = 0;
  T.answered = false;
  T.wordPool = session.wordPool;
  T.roundErrMap = {};
  T.batchSettled = false;
  T.spellCounted = {};

  $('#testSetup').hidden = true;
  $('#testRun').hidden = false;
  $('#testResult').hidden = true;
  renderQuestion();
}

function startReview() {
  // ★ 复习有断点 → 直接续上
  const saved = loadTestProgress('review');
  if (saved) {
    if (restoreTestProgress(saved)) {
      S.savedReviewProgress = null;
      updateExitButton();
      return;
    }
    // 存档失效（词被删了之类）就清掉，走正常流程
    clearTestProgress('review');
    S.savedReviewProgress = null;
  }

  const pool = S.words.filter(w => {
    if (!w.imageIds || !w.imageIds.length) return false;
    if (learningProgressOf(w) <= 0) return false;   // 没学过不进复习
    const r = retentionOf(w);
    return r !== null && r < 0.8;                    // 学过 + 记忆保留率 < 80%
  });
  if (!pool.length) return toast('没有待复习的单词', 'warn');

  // ★ 按 20 词分批
  const batches = [];
  for (let i = 0; i < pool.length; i += 20) {
    batches.push(pool.slice(i, i + 20));
  }

  T.mode = 'review';
  T.reviewPool = pool;
  T.reviewBatches = batches;
  T.reviewBatchIdx = 0;
  T.reviewPhase = 'choice';   // 每批先走「看词选图」
  T.reviewWrong = [];
  T.reviewSpellMode = '';
  T.reviewSpellPool = [];
  T.reviewCorrectStages = {};   // ★ 每次复习独立，清空上次的题型记录

  const firstBatch = batches[0];
  T.tasks = firstBatch.map(w => ({ word: w, stage: 'choice' }));
  T.taskIdx = 0;
  T.round = 1;
  T.roundWrong = [];
  T.roundErrMap = {};
  T.spellCounted = {};
  T.firstRoundTotal = 0;
  T.firstRoundCorrect = 0;
  T.answered = false;
  T.wordPool = pool;

  $('#testSetup').hidden = true;
  $('#testRun').hidden = false;
  $('#testResult').hidden = true;
  renderQuestion();
}

/* 音频按钮（底部，输入框下方）：点一下读单词 */
function bindSpellSpeakBtn(word) {
  const btn = $('#btnSpellSpeak');
  if (!btn) return;
  let lastAt = 0;
  const play = () => {
    const now = Date.now();
    if (now - lastAt < 350) return;
    lastAt = now;
    Speech.speak(word.text, { force: true });
  };
  // ★ 按钮永远不参与焦点：它一获得焦点，输入框就失焦，键盘必收。
  btn.tabIndex = -1;
  // ★ 核心：在「手指按下」的瞬间就拦住默认行为，
  //   按钮不会抢走输入框的焦点 → 键盘不收 → 画面纹丝不动。
  //   语音在同一瞬间播，所以 preventDefault 不会让它哑掉。
  btn.onpointerdown = (e) => {
    e.preventDefault();
    play();
  };
  // ★ 双保险：老内核 / pointerdown 被绕过时，mousedown 也拦一道
  btn.onmousedown = (e) => {
    e.preventDefault();
  };
  // ★ 最兜底：极老浏览器没有 PointerEvent，才退回 click 播放
  if (!window.PointerEvent) {
    btn.onclick = (e) => {
      e.preventDefault();
      play();
    };
  }
}

function bindSpellInput(word, stage) {
  const inp = $('#spellInput');
  if (!inp) return;

  // 每次进来都把当前词记到 dataset 上（事件处理读 dataset 拿最新词）
  inp.dataset.word = word.text;
  inp.dataset.stage = stage;

  // ★ 已经绑定过 → 只更新 dataset，不重新 focus、不重绑事件
  if (inp._bound) return;
  inp._bound = true;

  setTimeout(() => { try { inp.focus(); } catch (e) {} }, 80);

  inp.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); submitSpell(); }
  };

  inp.oninput = () => {
    if (!T.spellPendingRetry) return;
    T.spellPendingRetry = false;
    const answer = inp.dataset.word || '';
    const cur = inp.value;
    let newText = '';
    if (cur.length > answer.length && cur.startsWith(answer)) {
      newText = cur.slice(answer.length);
    }
    inp.value = newText;
    inp.classList.remove('bad', 'ok');
  };
}

/* ★ spell / reverse 单独处理 —— 同类连续时"增量更新"，输入框不重建，键盘不抖 */
function renderSpellOrReverse_task(t) {
  saveTestProgress();   // ★ 拼写题也自动存档
  const w = t.word;
  const stage = t.stage;
  T.answered = false;
  T.spellPendingRetry = false;
  const url = imgURL(w.imageIds[0]);

  // ★ 从其他题型切进来 → 重置锁状态，等键盘弹出时锁
  if (!_spellLockOn) {
    _spellLockOn = true;
    _appHLocked = false;
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
  }

  // 上一题和这一题是不是同一种题型？（决定能不能复用 DOM）
  const card = document.querySelector('#testRun .spell-card');
  const inp  = document.getElementById('spellInput');
  const canReuse = card && inp && card.dataset.stage === stage;

  // ★ spell ↔ reverse 切换时，DOM 会重建、键盘可能短暂收起，
  //   把「已锁死」状态放开，让 --app-h 等新输入框的键盘弹出后重新锁，
  //   避免 --app-h 还停在上一题（spell）时的高度。
  if (!canReuse && _appHLocked) {
    _appHLocked = false;
  }

  if (canReuse) {
    // ── 增量更新：DOM 不重建，input 不销毁 → 键盘纹丝不动 ──
    card.dataset.word = w.text;

    if (stage === 'spell') {
      const img = card.querySelector('.spell-img-wrap img');
      if (img && img.getAttribute('src') !== url) img.src = url;
      const capEl = card.querySelector('.spell-img-cap');
      const capText = meaningsToString(getMeanings(w).filter(m => !isPhraseMeaning(m)));
      if (capEl) {
        if (capText) { capEl.textContent = capText; capEl.hidden = false; }
        else { capEl.hidden = true; }
      }
    } else {
      const revEl = card.querySelector('.spell-rev-zh');
      if (revEl) {
        const plainMeanings = getMeanings(w).filter(m => !isPhraseMeaning(m));
        const meaning = plainMeanings.map(m =>
          (m.pos ? `<i class="rev-pos">${esc(m.pos)}</i>` : '') + esc(m.text)
        ).join('；');
        revEl.innerHTML = meaning || '（无释义）';
      }
    }

    // 清空输入框 + 清掉上次的 ok/bad 颜色
    inp.value = '';
    inp.classList.remove('ok', 'bad');
    // ★ 不 focus：键盘保持现状（本来就聚焦）
    // ★ 不重新 bindSpellInput：只需要更新 dataset 里的词
    inp.dataset.word = w.text;

    ensureQuizTopbar({ detail: false });
    bindSpellSpeakBtn(w);
    return;
  }

  // ── 结构不同（首次 / spell↔reverse 切换）→ 完整重建 ──
  if (stage === 'spell') {
    const capText = meaningsToString(getMeanings(w).filter(m => !isPhraseMeaning(m)));
    $('#testRun').innerHTML = `
      <div class="quiz-card spell-card" data-stage="spell">
        <div class="spell-img-wrap">
          <img src="${url}" alt="">
          ${capText ? `<div class="spell-img-cap">${esc(capText)}</div>` : ''}
        </div>
        <div class="spell-spacer"></div>
        <input class="spell-input-bare" id="spellInput"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               inputmode="text" enterkeyhint="done">
        <div class="spell-spacer"></div>
        <button type="button" class="spell-speak-btn" id="btnSpellSpeak" aria-label="发音">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H2v6h4l5 4z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path d="M19 5a10 10 0 0 1 0 14"/>
          </svg>
        </button>
      </div>`;
  } else {
    const plainMeanings = getMeanings(w).filter(m => !isPhraseMeaning(m));
    const meaning = plainMeanings.map(m =>
      (m.pos ? `<i class="rev-pos">${esc(m.pos)}</i>` : '') + esc(m.text)
    ).join('；');
    $('#testRun').innerHTML = `
      <div class="quiz-card spell-card" data-stage="reverse">
        <div class="spell-spacer"></div>
        <input class="spell-input-bare" id="spellInput"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               inputmode="text" enterkeyhint="done">
        <div class="spell-rev-zh">${meaning || '（无释义）'}</div>
        <div class="spell-spacer"></div>
        <button type="button" class="spell-speak-btn" id="btnSpellSpeak" aria-label="发音">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H2v6h4l5 4z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path d="M19 5a10 10 0 0 1 0 14"/>
          </svg>
        </button>
      </div>`;
  }
  bindSpellInput(w, stage);
  ensureQuizTopbar({ detail: false });
  bindSpellSpeakBtn(w);
}

function renderQuestion() {
  if (T.taskIdx >= T.tasks.length) return endRound();
 
  // ★ 拦截 spell / reverse：这两个题型走独立函数
  {
    const _t = T.tasks[T.taskIdx];
    if (_t && (_t.stage === 'spell' || _t.stage === 'reverse')) {
      renderSpellOrReverse_task(_t);
      return;
    }
  }

  // ★ 非拼写题：解除锁，让 --app-h 跟着键盘实时变化
  if (_spellLockOn) {
    _spellLockOn = false;
    _appHLocked = false;
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
  }

  saveTestProgress();   // ★ 每次切题都自动存档

  const task = T.tasks[T.taskIdx];
  const w = task.word;
  const stage = task.stage;
  T.answered = false;

  } else {
    progressText = `错题重测 · 第 ${T.taskIdx + 1} / ${T.tasks.length} 题`;

function submitSpell() {
  if (T.answered) return;
  const task = T.tasks[T.taskIdx];
  if (!task) return;
  const w = task.word;
  const inp = $('#spellInput');
  if (!inp) return;

  // 情况 A：这题刚答错、已显示正确答案。用户按"完成" → 重做这道题
  if (T.spellPendingRetry) {
    T.spellPendingRetry = false;
    inp.value = '';
    inp.classList.remove('bad', 'ok');
    const fb = $('#quizFb');
    if (fb) { fb.textContent = ''; fb.className = 'quiz-feedback'; }
    try { inp.focus(); } catch (e) {}
    return;
  }

  const val = inp.value.trim().toLowerCase();
  if (!val) return;
  const ok = val === w.text.toLowerCase();

  // ★ 每个题型独立计一道题：spell 和 reverse 各算一题
  const stageKey = task.stage;
  if (!T.spellCounted[w.id]) T.spellCounted[w.id] = new Set();
  const counted = T.spellCounted[w.id].has(stageKey);

  if (ok) {
    inp.classList.add('ok');
    T.answered = true;
    if (!counted && T.mode === 'learn') {
      T.spellCounted[w.id].add(stageKey);
      T.firstRoundTotal++;
      T.firstRoundCorrect++;
    }
    gradeWord(w, true);
    Speech.speak(w.text, { force: true });
    setTimeout(() => {
      T.taskIdx++;
      renderQuestion();
    }, 1000);
  } else {
    inp.classList.add('bad');
    inp.value = w.text;
    T.spellPendingRetry = true;
    if (!counted && T.mode === 'learn') {
      T.spellCounted[w.id].add(stageKey);
      T.firstRoundTotal++;
    }
    if (T.round === 1) {
      if (!T.roundErrMap[w.id]) T.roundErrMap[w.id] = {};
      T.roundErrMap[w.id][stageKey] = true;
    }
    if (!T.roundWrong.some(x => x.id === w.id)) {
      T.roundWrong.push(w);
    }
    gradeWord(w, false);
    Speech.speak(w.text, { force: true });
  }
}
function finishQuestion(ok, word) {
  T.answered = true;
  const stage = T.tasks[T.taskIdx].stage;

  // ── 复习模式：看词选图 / 看词选中文 ──
  if (T.mode === 'review') {
    if (!ok) {
      // ★ 复习中答错的词全部记进 reviewWrong，供拼写检测的「拼错题」使用
      if (!T.reviewWrong.some(x => x.id === word.id)) {
        T.reviewWrong.push(word);
      }
    }

    // ★ 按题型独立 +25%：本次复习中，这个题型只算一次
    let shouldAddProgress = false;
    if (ok) {
      const key = word.id;
      if (!T.reviewCorrectStages[key]) T.reviewCorrectStages[key] = new Set();
      if (!T.reviewCorrectStages[key].has(stage)) {
        T.reviewCorrectStages[key].add(stage);
        shouldAddProgress = true;
      }
    }
    gradeWord(word, ok, { review: true, addProgress: shouldAddProgress });

    if (ok) {
      setTimeout(() => {
        T.taskIdx++;
        renderQuestion();
      }, 800);
    } else {
      setTimeout(() => showLearnCard(word, false), 800);
    }
    return;
  }

  // ── 学习模式的「学习阶段」──
  if (T.mode === 'learn' && T.phase === 'learn') {
    gradeWord(word, ok);

    // 认识 / 不认识
    if (stage === 'self-sentence') {
      if (!ok) {
        if (T.round === 1) {
          if (!T.roundErrMap[word.id]) T.roundErrMap[word.id] = {};
          T.roundErrMap[word.id]['self-sentence'] = true;
        }
        // 不认识：把这个词的 6 步重新推到队尾，从头再走
        for (const s of LEARN_STAGES) {
          T.tasks.push({ word, stage: s });
        }
      }
      T.taskIdx++;
      renderQuestion();
      return;
    }

    // ★ 看词选图：选对停 0.8 秒进下一题；选错停 0.8 秒弹详情页，点「下一题」才继续
    if (stage === 'choice') {
      if (ok) {
        setTimeout(() => {
          T.taskIdx++;
          renderQuestion();
        }, 800);
      } else {
        if (T.round === 1) {
          if (!T.roundErrMap[word.id]) T.roundErrMap[word.id] = {};
          T.roundErrMap[word.id]['choice'] = true;
        }
        setTimeout(() => {
          const sheet = document.getElementById('wordSheet');
          if (!sheet) { T.taskIdx++; renderQuestion(); return; }
          sheet.classList.add('open');
          const closeBtn = document.getElementById('wordSheetClose');
          if (closeBtn) {
            closeBtn.textContent = '下一题';   // ★ 详情页底部按钮改为「下一题」
            closeBtn.onclick = () => {
              sheet.classList.remove('open');
              T.taskIdx++;
              renderQuestion();
            };
          }
        }, 800);
      }
      return;
    }

    // 前 2 步（example / choice-zh）
    // ★ 选错只亮红，不再在底部弹"正确答案"；0.8 秒后统一弹详情页，底部是「下一题」
    Speech.speak(word.text);
    setTimeout(() => showLearnCard(word, ok), 800);
    return;
  }
}

      _learnEnterHandler = null;
    }
    T.taskIdx++;
    renderQuestion();
  };
  _learnEnterHandler = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); goNext(); }
  };
  document.addEventListener('keydown', _learnEnterHandler);
  const _lcSpeak = $('#lcSpeak');
  if (_lcSpeak) _lcSpeak.onclick = () => Speech.speak(w.text);
  $('#lcNextBtn').onclick = goNext;
  setTimeout(() => { $('#lcNextBtn').focus(); }, 60);
}
/* ── 本轮结束：检查是否还有错词 ── */
function dedupWords(words) {
  const seen = new Set();
  const out = [];
  for (const w of words) {
    if (seen.has(w.id)) continue;
    seen.add(w.id);
    out.push(w);
  }
  return out;
}

/* ── 断点续传：存档 / 读档 / 清档 / 恢复 ── */
const TEST_PROGRESS_KEY_PREFIX = 'lexivault.mobile.testProgress';
function progressKeyOf(mode) {
  return TEST_PROGRESS_KEY_PREFIX + '.' + (mode === 'review' ? 'review' : 'learn');
}

function saveTestProgress() {
  if (!T.tasks || !T.tasks.length) return;
  if (T.mode !== 'learn' && T.mode !== 'review') return;
  try {
    const snap = {
      v: 2,
      ts: nowMs(),
      mode: T.mode,
      phase: T.phase || 'learn',
      // 学习
      batches: (T.batches || []).map(b => b.map(w => w.id)),
      batchIdx: T.batchIdx || 0,
      // 复习（新增：批号 + 阶段）
      reviewBatches: (T.reviewBatches || []).map(b => b.map(w => w.id)),
      reviewBatchIdx: T.reviewBatchIdx || 0,
      reviewPhase: T.reviewPhase || '',
      // 通用
      tasks: T.tasks.map(t => ({ wid: t.word.id, stage: t.stage })),
      taskIdx: T.taskIdx || 0,
      round: T.round || 1,
      roundWrong: (T.roundWrong || []).map(w => w.id),
      firstRoundTotal: T.firstRoundTotal || 0,
      firstRoundCorrect: T.firstRoundCorrect || 0,
      wordPool: (T.wordPool || []).map(w => w.id),
      roundErrMap: T.roundErrMap || {},
      batchSettled: !!T.batchSettled,
      reviewPool: (T.reviewPool || []).map(w => w.id),
      reviewWrong: (T.reviewWrong || []).map(w => w.id),
      reviewSpellMode: T.reviewSpellMode || '',
      reviewSpellPool: (T.reviewSpellPool || []).map(w => w.id),
    };
    localStorage.setItem(progressKeyOf(T.mode), JSON.stringify(snap));
  } catch (e) { console.warn('保存测试进度失败', e); }
}

function clearTestProgress(mode) {
  try {
    if (mode === 'learn' || mode === 'review') {
      localStorage.removeItem(progressKeyOf(mode));
    } else {
      localStorage.removeItem(progressKeyOf('learn'));
      localStorage.removeItem(progressKeyOf('review'));
    }
  } catch (e) {}
}

function loadTestProgress(mode) {
  try {
    const raw = localStorage.getItem(progressKeyOf(mode));
    if (!raw) return null;
    const s = JSON.parse(raw);
    // 兼容旧版 v:1（没拆 key 之前那份），只在读 learn 时兜底一下
    if (!s || (s.v !== 1 && s.v !== 2) || !Array.isArray(s.tasks) || !s.tasks.length) return null;
    return s;
  } catch (e) { return null; }
}

function restoreTestProgress(s) {
  if (!s || !s.tasks || !s.tasks.length) return false;
  const byId = new Map(S.words.map(w => [w.id, w]));
  const pick = ids => (ids || []).map(id => byId.get(id)).filter(Boolean);

  const tasks = s.tasks.map(t => ({ word: byId.get(t.wid), stage: t.stage })).filter(t => t.word);
  if (!tasks.length) return false;

  T.mode = s.mode || 'learn';
  T.phase = s.phase || 'learn';
  T.batches = (s.batches || []).map(b => pick(b));
  T.batchIdx = s.batchIdx || 0;
  T.tasks = tasks;
  T.taskIdx = Math.min(Math.max(s.taskIdx || 0, 0), tasks.length - 1);
  T.round = s.round || 1;
  T.roundWrong = pick(s.roundWrong);
  T.firstRoundTotal = s.firstRoundTotal || tasks.length;
  T.firstRoundCorrect = s.firstRoundCorrect || 0;
  T.answered = false;
  T.wordPool = pick(s.wordPool);
  T.roundErrMap = s.roundErrMap || {};
  T.batchSettled = !!s.batchSettled;
  T.reviewPool = pick(s.reviewPool);
  T.reviewWrong = pick(s.reviewWrong);
  T.reviewSpellMode = s.reviewSpellMode || '';
  T.reviewSpellPool = pick(s.reviewSpellPool);
  // ★ 复习分批 + 阶段（这批新加的）
  T.reviewBatches = (s.reviewBatches || []).map(b => pick(b));
  T.reviewBatchIdx = s.reviewBatchIdx || 0;
  T.reviewPhase = s.reviewPhase || '';

  $('#testSetup').hidden = true;
  $('#testRun').hidden = false;
  $('#testResult').hidden = true;
  renderQuestion();
  updateExitButton();
  return true;
}

/* 顶部「退出」按钮的显隐（仅测试进行中显示） */
function updateExitButton() {
  const btn = $('#btnExitTest');
  const inTest = S.view === 'test' && !$('#testRun').hidden;
  if (btn) btn.hidden = !inTest;
  // ★ 测试进行中：给 body 加 test-mode 类，顶栏 + 底栏自动隐藏
  document.body.classList.toggle('test-mode', inTest);
  // ★ 进入答题界面时压一层 history，让系统返回键能"回到测试首页"
  if (inTest && !_atQuiz) {

    history.pushState({ quiz: true }, '');
  }

  if (!inTest) {

}

/* 按批次号重建该批次的学习任务队列（每个词依次走 5 步） */
function buildBatchTasks(batchIdx) {
  const batch = T.batches[batchIdx] || [];
  const tasks = [];
  const stages = getEnabledStages();
  for (const stage of stages) {
    for (const word of batch) {
      tasks.push({ word, stage });
    }
  }
  return tasks;
}

/* 批次首轮走完后，批量结算这一批所有词的学习进度
   progress = max(0, 1 - 答错次数 × 0.25) */
function settleBatchProgress() {
  const batch = T.batches[T.batchIdx] || [];
  const now = nowMs();
  for (const w of batch) {
    const errStages = T.roundErrMap[w.id] || {};
    const errCount = Object.keys(errStages).length;
    const base = Math.max(0, 1 - errCount * 0.25);
    if (!w.srs) w.srs = { strength: S.settings.srsInit, lastReview: null, reviews: [] };
    w.srs.baseRetention = base;      // ★ 初始记忆率（可能是 0）
    w.srs.learnProgress = 1;         // ★ 学过了，固定 1（不再存答对率）
    w.srs.lastReview = now;          // ★ 衰减起点 = 学完那一刻
    w.updatedAt = now;
    DB.put('words', w);
  }
}

function endRound() {
  // ── 复习模式 ──
  if (T.mode === 'review') {
    // 拼写阶段走完 → 复习彻底结束，回测试首页
    if (T.reviewPhase === 'spell') {
      clearTestProgress('review');
      S.savedReviewProgress = null;
      $('#testRun').hidden = true;
      $('#testResult').hidden = true;
      $('#testSetup').hidden = false;
      updateExitButton();
      renderTestHome();
      toast('复习完成', 'ok');
      return;
    }

    // 第 1 轮（看词选图）走完 → 第 2 轮（看词选中文）
    if (T.reviewPhase === 'choice') {
      const batch = T.reviewBatches[T.reviewBatchIdx];
      T.tasks = batch.map(w => ({ word: w, stage: 'choice-zh' }));
      T.taskIdx = 0;
      T.reviewPhase = 'choice-zh';
      return renderQuestion();
    }

    // 第 2 轮（看词选中文）走完 → 下一批 或 拼写检测页
    if (T.reviewPhase === 'choice-zh') {
      const nextBatchIdx = T.reviewBatchIdx + 1;
      if (nextBatchIdx < T.reviewBatches.length) {
        T.reviewBatchIdx = nextBatchIdx;
        const batch = T.reviewBatches[nextBatchIdx];
        T.tasks = batch.map(w => ({ word: w, stage: 'choice' }));
        T.taskIdx = 0;
        T.reviewPhase = 'choice';
        return renderQuestion();
      }
      return showSpellCheckPage();
    }
    return;
  }

  if (T.mode !== 'learn') return showResult();

  // ── 整批 6 步走完 → 结算本批进度 ──
  if (!T.batchSettled) {
    settleBatchProgress();
    T.batchSettled = true;
  }

  // 有错词 → 用「看中文拼英文」重测
  if (T.roundWrong.length > 0) {
    const wrongWords = dedupWords(T.roundWrong);
    T.tasks = wrongWords.map(w => ({ word: w, stage: 'reverse' }));
    T.taskIdx = 0;
    T.round++;
    T.roundWrong = [];
    return showRoundBreak(wrongWords.length);
  }

  // 无错词 → 下一批
  const nextBatchIdx = T.batchIdx + 1;
  if (nextBatchIdx < T.batches.length) {
    T.batchIdx = nextBatchIdx;
    T.tasks = buildBatchTasks(T.batchIdx);
    T.taskIdx = 0;
    T.round = 1;
    T.roundErrMap = {};
    T.batchSettled = false;
    return showBatchBreak(nextBatchIdx + 1, T.batches.length);
  }

  // 全部完成
  showResult();
}

  T.taskIdx = 0;
  T.round = 1;
  T.roundWrong = [];
  T.roundErrMap = {};
  T.spellCounted = {};

  T.firstRoundCorrect = 0;

let _lookupTimer = null;

const LOOKUP_MODE_KEY = 'lexivault.mobile.lookupMode';
function getLookupMode() {
  try { return localStorage.getItem(LOOKUP_MODE_KEY) || 'mine'; }
  catch (e) { return 'mine'; }
}
/* 同步按钮文字 / 颜色 / 输入框 placeholder */
function refreshLookupModeUI() {

function renderLookup() {
  const input = $('#lookupInput');
  const box = $('#lookupResult');
  const clearBtn = $('#lookupClear');
  if (!input || !box) return;
  const q = (input.value || '').trim();
  if (clearBtn) clearBtn.hidden = !q;

  if (!q) {

    box.innerHTML = mode === 'dict'
      ? `<div class="lookup-tip">

        </div>`

}

/* 从离线词典 cet4.json 里搜词（同步，需要 map 已加载） */
function searchLocalDict(keyword) {
  const map = Dict.getMap();
  if (!map) return [];
  const k = keyword.toLowerCase();
  const out = [];
  for (const entry of map.values()) {
    const w = (entry.word || '').toLowerCase();
    let score = -1;
    if (w === k) score = 95;
    else if (w.startsWith(k)) score = 70;
    else if (w.includes(k)) score = 50;
    else {
      const mArr = entry.meanings || [];
      if (mArr.some(m => (m.text || '').toLowerCase().includes(k))) score = 25;
    }
    if (score > 0) out.push({ entry, score });
  }
  out.sort((a, b) => b.score - a.score);
  return out;
}

async function doLookupSearch(keyword) {
  const box = $('#lookupResult');
  if (!box) return;
  const mode = getLookupMode();
  const k = keyword.toLowerCase();

  box.innerHTML = `<div class="lookup-tip">
    <div class="big">⏳</div>正在搜索…
  </div>`;

  if (mode === 'dict') {
    // ── 词典模式 ──
    try { await Dict.load(); } catch (e) {}
    const results = searchLocalDict(keyword);
    renderDictResults(keyword, results);
  } else {
    // ── 我的词库模式 ──
    const results = [];
    for (const w of S.words) {
      const text = (w.text || '').toLowerCase();
      const meaning = (w.meaning || '').toLowerCase();
      let score = -1;
      if (text === k) score = 100;
      else if (text.startsWith(k)) score = 80;
      else if (text.includes(k)) score = 60;
      else if (meaning.includes(k)) score = 30;
      if (score > 0) results.push({ w, score });
    }
    results.sort((a, b) => b.score - a.score);
    renderMyWordResults(keyword, results);
  }
}

/* 渲染「我的词库」结果 */
function renderMyWordResults(keyword, results) {
  const box = $('#lookupResult');
  if (!box) return;

  if (!results.length) {
    box.innerHTML = `<div class="lookup-tip">
      我的词库里没有「${esc(keyword)}」<br>
      <span style="font-size:12.5px">点搜索框右边的「词典」再试一次</span>
    </div>`;
    return;
  }

  box.innerHTML = results.map(({ w }, i) => {
    const url = w.imageIds && w.imageIds.length ? imgURL(w.imageIds[0]) : null;
    const meanings = getMeanings(w);

/* ── 接口盒子词典（英查中，带音标和词性）── */
async function fetchWordInfoFromApiHz(word) {
  // ★ 先查本地词典
  try {
    const local = await Dict.lookup(word);
    if (local) {
      console.log('[LexiVault] 本地词典命中:', word);
      return {
        phonetic: local.phonetic || '',
        meanings: local.meanings || [],
        phrases: local.phrases || [],
        sentences: local.sentences || [],
        source: 'local',
      };
    }
  } catch (e) {
    console.warn('[LexiVault] 本地词典查询异常', e);
  }

  // ★ 本地未命中，走接口盒子
  const id = S.apiHz.id;
  const key = S.apiHz.key;
  if (!id || !key) return null;
  Stats.add('apihz', 1);
  const url = `https://cn.apihz.cn/api/zici/danci.php?id=${encodeURIComponent(id)}&key=${encodeURIComponent(key)}&word=${encodeURIComponent(word)}`;
  let resp;
  if (typeof window.__LEXIVAULT_DAV_PROXY__ === 'function') {
    resp = await window.__LEXIVAULT_DAV_PROXY__('GET', url, {}, null);
  } else {
    resp = await fetch(url);
  }
  if (!resp.ok) return null;
  const text = await resp.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }
  if (Number(data.code) !== 200) return null;

  // 音标：优先英式
  const phonetic = (data.british || data.american || '').trim();

  // 释义：拆分 + 清理
  const meanings = parseApiHzMeanings((data.jbjs || '').trim());

  return { phonetic, meanings };
}

/* 把接口盒子返回的 jbjs 拆成多个 {pos, text}
   输入示例：
   "prep.当做 conj.与...一样,当...之时,象,因为 [域] American Samoa,东萨摩亚 [军] Air to Surface,空对地 (As)symb [化]砷 (arsenic)"
   输出：
   [ {pos:'prep.',text:'当做'}, {pos:'conj.',text:'与...一样,当...之时,象,因为'} ] */
function parseApiHzMeanings(raw) {
  if (!raw) return [];
  // 按词性标记切段（形如 prep. / conj. / n. / vt. 等）
  const re = /([a-z]{1,6}\.)/gi;
  const parts = [];
  let lastIndex = 0, lastPos = '', m;
  while ((m = re.exec(raw)) !== null) {
    if (lastPos) parts.push({ pos: lastPos, text: raw.slice(lastIndex, m.index) });
    lastPos = m[1].toLowerCase();
    lastIndex = m.index + m[1].length;
  }
  if (lastPos) parts.push({ pos: lastPos, text: raw.slice(lastIndex) });

  // 逐段清理：切掉 [xxx] / (xxx) 及之后的内容，去掉尾部标点
  const out = [];
  for (const p of parts) {
    let t = p.text;
    const bi = t.search(/\[[^\]]*\]/);     // [域]、[军]、[化] 等
    if (bi >= 0) t = t.slice(0, bi);
    const pi = t.search(/\([^)]*\)/);      // (As)symb 等
    if (pi >= 0) t = t.slice(0, pi);
    t = t.replace(/[,，;；\s]+$/, '').trim();
    if (t) out.push({ pos: p.pos, text: t });
  }
  return out;
}

/* 把词典条目一键填进「新建」页，并跳转过去
   entry 结构：{ word, phonetic, meanings: [{pos, text}], phrases: [{phrase, translation}] } */
function fillCreateFromDict(entry) {
  if (!entry) return;
  const word = String(entry.word || '').trim();
  if (!word) return;

  // 词库已有 → 提示（但仍然填充，用户可自行决定是否覆盖/编辑）
  const dup = S.words.some(w => (w.text || '').toLowerCase() === word.toLowerCase());
  if (dup) {
    toast(`「${word}」已在词库中，仍已填到新建页`, 'warn');
  } else {
    toast(`已填充「${word}」，绑定图片即可保存`, 'ok');
  }

  // 1) 更新内存草稿 C
  C.word = word;
  C.phonetic = entry.phonetic || '';
  const ms = Array.isArray(entry.meanings) ? entry.meanings : [];
  C.meanings = ms.length
    ? ms.map(m => ({ pos: m.pos || '', text: m.text || '' }))
    : [{ pos: '', text: '' }];

  // ★ 把词组拼成一条 phr. 释义，跟「📖 查词」按钮的行为保持一致
  if (Array.isArray(entry.phrases) && entry.phrases.length) {
    const phraseText = entry.phrases
      .filter(p => p && p.phrase && p.translation)
      .map(p => `${p.phrase}: ${p.translation}`)
      .join('；');
    if (phraseText) C.meanings.push({ pos: 'phr.', text: phraseText });
  }

  // 清空其它字段（避免继承上一次编辑的临时状态）
  C.category = '';
  C.sentence = '';
  C.imageIds = [];

  // 2) 更新 DOM 输入框（renderCreate 只渲染释义列表和图片网格，不填 input）
  const t = $('#cwText');     if (t) t.value = C.word;
  const p = $('#cwPhonetic'); if (p) p.value = C.phonetic;
  const c = $('#cwCategory'); if (c) c.value = '';
  const s = $('#cwSentence'); if (s) s.value = '';

  renderCreate();
  switchView('create');
}

/* 把 fetchWordInfo 的结果填进新建表单 */
function fillWordInfo(info) {
  if (!info) return;

  // 1) 释义
  if (info.meanings && info.meanings.length) {
    C.meanings = info.meanings.map(m => ({ pos: m.pos || '', text: m.text }));
    // ★ 把词组拼进最后一条释义
    if (info.phrases && info.phrases.length) {
      const phraseText = info.phrases
        .filter(p => p && p.phrase && p.translation)
        .map(p => `${p.phrase}: ${p.translation}`)
        .join('；');
      if (phraseText) C.meanings.push({ pos: 'phr.', text: phraseText });
    }
    renderCreateMeanings();
  } else if (info.meaning) {
    C.meanings = [{ pos: info.pos || '', text: info.meaning }];
    renderCreateMeanings();
  }

  // 2) 音标
  if (info.phonetic) {
    let ph = info.phonetic;
    if (!/^[\/\[ˈˌ]/.test(ph)) ph = '/' + ph + '/';
    $('#cwPhonetic').value = ph;
    C.phonetic = ph;
  }

  // 3) 例句：不再从公共词典填，只走智谱（跟图片绑定）
}

let _pixabayPage = 1;
function openSmartImagePicker(word, onPicked) {
  if (!word) return toast('请输入英文单词', 'warn');
  const modal = $('#smartImageModal');
  const grid = $('#smartImageGrid');
  const tip = $('#smartImageTip');
  if (!modal || !grid || !tip) return;
  modal.hidden = false;
  pushModalHistory('smartImageModal');
  grid.innerHTML = '<div class="smart-empty">正在搜索图片…</div>';
  tip.textContent = `正在搜索「${word}」的相关图片…`;

  const provider = S.imgApi.provider || 'pixabay';
  const key = S.imgApi.key;

  const fetchImages = async () => {
    let urls = [];
    try {
      if (provider === 'loremflickr') {
        for (let i = 0; i < 3; i++) {
          urls.push(`https://loremflickr.com/400/400/${encodeURIComponent(word)}?random=${Date.now() + i}`);
        }
      } else if (provider === 'pixabay') {
        if (!key) throw new Error('未配置 Pixabay API Key，请到设置里填');
        Stats.add('pixabay', 1);
        const resp = await fetch(`https://pixabay.com/api/?key=${key}&q=${encodeURIComponent(word)}&image_type=photo&per_page=3&page=${_pixabayPage}&safesearch=true`);
        const data = await resp.json();
        if (data.hits && data.hits.length) {
          urls = data.hits.map(h => h.webformatURL);
          _pixabayPage++;
        } else {
          _pixabayPage = 1;
          throw new Error('没有更多图片了，已回到第 1 页');
        }
      }
      if (!urls.length) {
        grid.innerHTML = '<div class="smart-empty">没有找到相关图片</div>';
        return;
      }
      grid.innerHTML = urls.map(url => `
        <button type="button" class="pick" data-url="${esc(url)}">
          <img src="${url}" alt="" onerror="this.style.background='#14141f'">
        </button>
      `).join('');
      tip.textContent = '点击图片即可下载并绑定到当前单词';
    } catch (err) {
      grid.innerHTML = `<div class="smart-empty" style="color:#ff6b81">搜索失败：${esc(err.message || err)}</div>`;
    }
  };

  fetchImages();
  $('#smartImgRefresh').onclick = fetchImages;
  $('#smartImgCancel').onclick = () => { closeModal('smartImageModal'); };
  grid.onclick = async e => {
    const btn = e.target.closest('.pick');
    if (!btn) return;
    const url = btn.dataset.url;
    tip.textContent = '正在下载图片…';
    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('网络请求失败');
      const blob = await resp.blob();
      const file = new File([blob], `${word}.jpg`, { type: 'image/jpeg' });
      const added = await addImagesFromFiles([file]);
      if (added.length) {
        closeModal('smartImageModal');
        if (onPicked) onPicked(added);
        toast('图片已下载并绑定', 'ok');
      }
    } catch (err) {
      toast('下载失败：' + (err.message || err), 'err');
    }
  };
}

/* ══════════════════════════════════════════════
   §6.73  总词库
   ══════════════════════════════════════════════ */
let _libTimer = null;

function renderLibrary() {
  // 分类下拉填充
  const cats = [...new Set(S.words.map(w => w.category || '未分类'))].sort();
  const catSel = $('#libCat');
  if (catSel) {
    const cur = S.filters.cat || 'all';
    catSel.innerHTML = `<option value="all">全部分类 (${S.words.length})</option>` +
      cats.map(c => `<option value="${esc(c)}">${esc(c)} (${S.words.filter(w => (w.category || '未分类') === c).length})</option>`).join('');
    catSel.value = (cats.includes(cur) || cur === 'all') ? cur : 'all';
  }

  // 字母条
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const present = new Set(S.words.map(w => (w.text[0] || '').toUpperCase()));
  const alphaBar = $('#alphaBar');
  if (alphaBar) {
    alphaBar.innerHTML =
      `<button class="alpha ${S.filters.letter === 'all' ? 'on' : ''}" data-l="all">全部</button>` +
      letters.map(l => `<button class="alpha ${S.filters.letter === l ? 'on' : ''} ${present.has(l) ? '' : 'off'}" data-l="${l}">${l}</button>`).join('');
    alphaBar.querySelectorAll('.alpha').forEach(btn => {
      btn.onclick = () => {
        const l = btn.dataset.l;
        S.filters.letter = S.filters.letter === l ? 'all' : l;
        renderLibrary();
      };
    });
  }

  // 过滤
  let list = S.words.filter(w => {
    const { q, cat, letter } = S.filters;
    if (q) {
      const k = q.toLowerCase();
      if (!w.text.toLowerCase().includes(k) && !(w.meaning || '').toLowerCase().includes(k)) return false;
    }
    if (cat !== 'all' && (w.category || '未分类') !== cat) return false;
    if (letter !== 'all' && (w.text[0] || '').toUpperCase() !== letter) return false;
    return true;
  });

  // 排序
  const sort = S.filters.sort;
  if (sort === 'new') list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  else if (sort === 'old') list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  else if (sort === 'az') list.sort((a, b) => a.text.localeCompare(b.text));
  else if (sort === 'za') list.sort((a, b) => b.text.localeCompare(a.text));
  else if (sort === 'weak') list.sort((a, b) => {
    const ra = retentionOf(a) ?? -1, rb = retentionOf(b) ?? -1;
    return ra - rb;
  });

  // 渲染
  const box = $('#wordList');
  const empty = $('#libEmpty');
  if (!box) return;
  if (!list.length) {
    box.innerHTML = '';
    if (empty) empty.hidden = false;
    return;
  }
  if (empty) empty.hidden = true;
  box.innerHTML = list.map((w, i) => {
    const url = w.imageIds && w.imageIds.length ? imgURL(w.imageIds[0]) : null;
    const p = memoryRateOf(w);
    const c = progColor(p);
    const pct = Math.round(p * 100) + '%';
    const meanings = getMeanings(w);
    const meanText = meanings.length ? meaningsToString(meanings) : '— 暂无释义 —';
    return `<div class="word-item" data-id="${w.id}" style="animation-delay:${Math.min(i * 18, 300)}ms">
      <div class="wi-img">
        ${url ? `<img src="${url}" alt="" loading="lazy">` : `<div class="no-img">无图</div>`}
      </div>
      <div class="wi-body">
        <div class="wi-word">${esc(w.text)}</div>
        <div class="wi-mean">${esc(meanText)}</div>
        <div class="wi-foot">
          <span class="wi-cat">${esc(w.category || '未分类')}</span>
          <span class="wi-ret" style="color:${c}">
            <span class="rd" style="background:${c};box-shadow:0 0 8px ${c}"></span>
            ${pct}
          </span>
        </div>
      </div>
    </div>`;
  }).join('');

  $$('#wordList .word-item').forEach(el => {
    el.onclick = () => {
      const w = S.words.find(x => x.id === el.dataset.id);
      if (w) openLibraryDetail(w);
    };
  });
}

  const rc = progColor(p);
  const pTxt = Math.round(p * 100) + '%';

  if (!body) return;

  // 编辑中的临时状态（不影响 S.words，直到保存）
  const edit = {
    text: w.text || '',
    phonetic: w.phonetic || '',
    category: w.category || '',
    meanings: (getMeanings(w).length
      ? getMeanings(w).map(m => ({ pos: m.pos || '', text: m.text || '' }))
      : [{ pos: '', text: '' }]),
  };

  const renderMeanings = () => {
    const wrap = $('#ewMeaningsList');
    if (!wrap) return;
    wrap.innerHTML = edit.meanings.map((m, i) => `
      <div class="meaning-row" data-i="${i}">
        <select class="pos-select" data-i="${i}">
          ${buildPosOptions(m.pos)}
        </select>
        <input class="meaning-input" data-i="${i}" value="${esc(m.text || '')}"
               placeholder="${i === 0 ? '例如：苹果' : '另一个意思…'}"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        ${edit.meanings.length > 1 ? `<button type="button" class="remove-mean" data-i="${i}" title="删除">✕</button>` : ''}
      </div>
    `).join('');
    $$('.pos-select', wrap).forEach(sel => {
      sel.onchange = e => { edit.meanings[+e.target.dataset.i].pos = e.target.value; };
    });
    $$('.meaning-input', wrap).forEach(inp => {
      inp.oninput = e => { edit.meanings[+e.target.dataset.i].text = e.target.value; };
    });
    $$('.remove-mean', wrap).forEach(btn => {
      btn.onclick = () => {
        edit.meanings.splice(+btn.dataset.i, 1);
        if (!edit.meanings.length) edit.meanings.push({ pos: '', text: '' });
        renderMeanings();
      };
    });
  };

  body.innerHTML = `
    <div style="font-size:17px;font-weight:700;margin-bottom:16px">✏️ 编辑单词</div>

    <label>英文单词</label>
    <input class="input" id="ewText" value="${esc(edit.text)}"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <label>音标（可选）</label>
    <input class="input" id="ewPhonetic" value="${esc(edit.phonetic)}"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <label>分类（可选）</label>
    <input class="input" id="ewCategory" value="${esc(edit.category)}"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <label>中文释义</label>
    <div id="ewMeaningsList" class="meanings-list"></div>
    <button type="button" class="btn block" id="ewAddMeaning"
            style="border-style:dashed;color:var(--muted);font-size:13.5px;min-height:42px">
      ＋ 添加意思
    </button>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px">
      <button class="btn" id="ewCancel">取消</button>
      <button class="btn primary" id="ewSave">💾 保存</button>
    </div>
  `;

  renderMeanings();

  $('#ewText').oninput = e => { edit.text = e.target.value; };
  $('#ewPhonetic').oninput = e => { edit.phonetic = e.target.value; };
  $('#ewCategory').oninput = e => { edit.category = e.target.value; };
  $('#ewAddMeaning').onclick = () => {
    edit.meanings.push({ pos: '', text: '' });
    renderMeanings();
    setTimeout(() => {
      const inputs = $$('#ewMeaningsList .meaning-input');
      if (inputs.length) inputs[inputs.length - 1].focus();
    }, 30);
  };

  $('#ewCancel').onclick = () => {
    openLibraryDetail(w);
  };

  $('#ewSave').onclick = async () => {
    const text = edit.text.trim();
    if (!text) return toast('请先输入英文单词', 'warn');

    const lower = text.toLowerCase();
    const dup = S.words.find(x => x.id !== w.id && (x.text || '').toLowerCase() === lower);
    if (dup) return toast('已存在同名单词「' + dup.text + '」', 'warn');

    const validMeanings = edit.meanings.filter(m => m.text && m.text.trim());
    if (!validMeanings.length) return toast('请至少填写一个中文意思', 'warn');

    w.text = text;
    w.phonetic = edit.phonetic.trim();
    w.category = edit.category.trim() || '未分类';
    w.meanings = validMeanings.map(m => ({ pos: m.pos || '', text: m.text.trim() }));
    w.meaning = w.meanings.map(m => (m.pos ? `[${m.pos}] ` : '') + m.text).join('；');
    w.updatedAt = nowMs();  // ★ 同步用

    try {
      await DB.put('words', w);
      toast('已保存', 'ok');
      renderLibrary();
      renderLookup();
      renderTestHome();
      openLibraryDetail(w);
    } catch (e) {
      toast('保存失败：' + (e.message || e), 'err');
    }
  };
}

async function deleteWordFromLibrary(word) {
  const imgIds = [...(word.imageIds || [])];
  S.words = S.words.filter(x => x.id !== word.id);
  await DB.del('words', word.id);
  for (const imgId of imgIds) {
    const stillUsed = S.words.some(x => x.imageIds && x.imageIds.includes(imgId));
    if (stillUsed) continue;
    const u = S.urls.get(imgId);
    if (u) { URL.revokeObjectURL(u); S.urls.delete(imgId); }
    S.images = S.images.filter(i => i.id !== imgId);
    await DB.del('images', imgId);
  }
}

/* ══════════════════════════════════════════════
   §6.75  WebDAV 客户端（坚果云）
   ══════════════════════════════════════════════ */
const WebDAV = (() => {

  function cfg() { return S.settings.webdav || {}; }
  function isConfigured() {
    const c = cfg();
    return !!(c.url && c.user && c.pass);
  }
  function authHeader() {
    const c = cfg();
    // btoa 只支持 latin1，用 UTF-8 编码中转
    const raw = `${c.user}:${c.pass}`;
    const bytes = new TextEncoder().encode(raw);
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return 'Basic ' + btoa(bin);
  }
  function fullUrl(path) {
    const base = (cfg().url || '').replace(/\/+$/, '');
    return base + '/' + String(path || '').replace(/^\/+/, '');
  }

  async function request(method, path, body = null, contentType = 'application/json') {
    const headers = {
      Authorization: authHeader(),
      // ★ 坚果云要求 User-Agent 里含 "DAV"，否则返回 403
      'User-Agent': 'LexiVault-WebDAV/1.0',
    };
    if (body !== null && contentType) headers['Content-Type'] = contentType;
    const url = fullUrl(path);

    // ★ 优先用 Tampermonkey 代理（绕过 CORS）
    if (typeof window.__LEXIVAULT_DAV_PROXY__ === 'function') {
      console.log('[LexiVault] 走 Tampermonkey 代理:', method, url);
      return window.__LEXIVAULT_DAV_PROXY__(method, url, headers, body);
    }
    console.log('[LexiVault] 走原生 fetch:', method, url);

    const opts = { method, headers };
    if (body !== null) opts.body = body;
    return fetch(url, opts);
  }

  async function getJSON(path) {
    const resp = await request('GET', path);
    if (resp.status === 404) return { data: null, size: 0 };
    if (resp.status === 401) throw new Error('账号或应用密码错误');
    if (!resp.ok) throw new Error(`GET 失败：HTTP ${resp.status}`);
    const text = await resp.text();
    const size = new Blob([text]).size;
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw new Error('云端文件格式错误'); }
    return { data, size };
  }

  async function putJSON(path, obj) {
    const body = JSON.stringify(obj);
    const size = new Blob([body]).size;
    const resp = await request('PUT', path, body, 'application/json');
    if (resp.status === 401) throw new Error('账号或应用密码错误');
    if (!resp.ok) throw new Error(`PUT 失败：HTTP ${resp.status}`);
    return { size };
  }

  async function getBlob(path) {
    const resp = await request('GET', path);
    if (resp.status === 404) return null;
    if (resp.status === 401) throw new Error('账号或应用密码错误');
    if (!resp.ok) throw new Error(`GET 图片失败：HTTP ${resp.status}`);
    return resp.blob();
  }

  async function putBlob(path, blob) {
    const resp = await request('PUT', path, blob, 'application/octet-stream');
    if (resp.status === 401) throw new Error('账号或应用密码错误');
    if (!resp.ok) throw new Error(`PUT 图片失败：HTTP ${resp.status}`);
    return true;
  }

  /* 只读根目录，验证账号密码是否可用 */
  async function testConnection() {
    if (!isConfigured()) throw new Error('请先填写服务器、账号、密码');
    const resp = await request('GET', './', null, null);
    if (resp.status === 401) throw new Error('账号或应用密码错误');
    // 207 是 WebDAV 目录列表的正常响应，200 也行
    // 403 也视为成功：坚果云不允许列目录，但文件读写正常
    if (resp.status === 207 || resp.status === 200 || resp.status === 404 || resp.status === 403) return true;
    throw new Error(`连接失败：HTTP ${resp.status}`);
  }

  /* 自动建目录（不存在时才建，存在返回 405 也当成功） */
  async function ensureDir(path) {
    const resp = await request('MKCOL', path, null, null);
    // 201 = 创建成功；405 = 已存在；301/302 = 重定向
    return resp.status === 201 || resp.status === 405 || resp.ok;
  }

  return {
    isConfigured, getJSON, putJSON, getBlob, putBlob,
    testConnection, ensureDir,
  };
})();

   §6.8  设置 / 导出 / 导入

function calcDataSize() {
  const bytes = S.images.reduce((s, i) => s + (i.size || 0), 0);
  return bytes;
}
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function blobToDataURL(blob) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.readAsDataURL(blob);
  });
}
function dataURLToBlob(d) {
  const [meta, b64] = d.split(',');
  const mime = (meta.match(/:(.*?);/) || [, 'image/jpeg'])[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function showProgress(title) {
  const modal = document.getElementById('progressModal');
  if (!modal) return;
  modal.querySelector('h3').textContent = title || '正在处理…';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressText').textContent = '准备中…';
  modal.hidden = false;
  document.body.classList.add('modal-open');
}
function updateProgress(cur, total, label) {
  const fill = document.getElementById('progressFill');
  const txt = document.getElementById('progressText');
  if (!fill || !txt) return;
  const pct = total > 0 ? Math.round(cur / total * 100) : 0;
  fill.style.width = pct + '%';
  txt.textContent = label || `${cur} / ${total}`;
}
function hideProgress() {
  const modal = document.getElementById('progressModal');
  if (modal) modal.hidden = true;
  document.body.classList.remove('modal-open');
}
