/* ── 合并算法（与 PC 版将保持一致） ── */
function mergeSrs(a, b) {
  if (!a) return b;
  if (!b) return a;
  const at = a.lastReview || 0;
  const bt = b.lastReview || 0;

  // ★ baseRetention 取最大值（学得好的一边胜出），老数据用 learnProgress 兜底
  const ab = (a.baseRetention !== undefined) ? a.baseRetention
           : (a.learnProgress !== undefined ? a.learnProgress : 0);
  const bb = (b.baseRetention !== undefined) ? b.baseRetention
           : (b.learnProgress !== undefined ? b.learnProgress : 0);
  const maxRetention = Math.max(ab, bb);

  let merged;
  if (bt > at) merged = { ...b };
  else if (at > bt) merged = { ...a };
  else {
    merged = {
      strength: Math.max(a.strength || 0, b.strength || 0),
      lastReview: at,
      reviews: [...(a.reviews || []), ...(b.reviews || [])]
        .sort((x, y) => x.t - y.t)
        .slice(-60),
    };
  }
  merged.baseRetention = maxRetention;
  merged.learnProgress = maxRetention > 0 ? 1 : 0;   // ★ 归一化
  return merged;
}
function mergeWord(local, remote) {
  // 冲突判定：谁的 updatedAt 新，谁赢基础字段；SRS 单独合并
  const lAt = local.updatedAt || local.createdAt || 0;
  const rAt = remote.updatedAt || remote.createdAt || 0;
  const newer = rAt > lAt ? remote : local;
  const merged = { ...newer };
  // imageIds 取并集
  merged.imageIds = [...new Set([...(local.imageIds || []), ...(remote.imageIds || [])])];
  // SRS 合并
  merged.srs = mergeSrs(local.srs, remote.srs);
  // createdAt 取更早的（真实创建时间）
  merged.createdAt = Math.min(local.createdAt || Infinity, remote.createdAt || Infinity);
  // updatedAt 取更晚的
  merged.updatedAt = Math.max(lAt, rAt);
  return merged;
}

/* ── 导入 ── */
async function importPack(file) {
  try {
    const text = await file.text();
    const pack = JSON.parse(text);
    if (pack.app !== 'LexiVault') return toast('不是 LexiVault 数据文件', 'err');

    // 兼容旧版（PC 现在 version: 1）
    const packSchema = pack.schemaVersion || pack.version || 1;
    if (packSchema > SCHEMA_VERSION) {
      return toast(`数据版本 ${packSchema} 高于本 App（${SCHEMA_VERSION}），请升级 App`, 'err');
    }

    const stats = { newWords: 0, updatedWords: 0, newImages: 0, newArticles: 0 };
    const imgTotal = (pack.images || []).length;
    const showBar = imgTotal > 0;
    if (showBar) showProgress('正在导入图片…');

    // ── 图片先导入（单词要用到 imageId）──
    if (imgTotal) {
      const existingIds = new Set(S.images.map(i => i.id));
      const newImgs = [];
      let i = 0;
      for (const im of pack.images) {
        i++;
        updateProgress(i, imgTotal, `导入图片 ${i} / ${imgTotal}`);
        await new Promise(r => setTimeout(r, 0));   // 让浏览器渲染进度条
        if (existingIds.has(im.id)) continue;
        if (!im.data) continue;   // 轻量包不带图
        try {
          const rec = {
            id: im.id || uid(),
            name: im.name || 'image',
            blob: dataURLToBlob(im.data),
            size: im.size || 0,
            createdAt: im.createdAt || nowMs(),
          };
          newImgs.push(rec);
        } catch (e) { console.warn('图片导入失败', im.id, e); }
      }
      if (newImgs.length) {
        await DB.bulkPut('images', newImgs);
        newImgs.forEach(im => {
          S.images.push(im);
          S.urls.set(im.id, URL.createObjectURL(im.blob));
        });
        stats.newImages = newImgs.length;
      }
    }
    if (showBar) hideProgress();

    // ── 单词合并 ──
    if (pack.words && pack.words.length) {
      const localMap = new Map(S.words.map(w => [w.id, w]));
      const toPut = [];
      for (const rw of pack.words) {
        if (!rw.id) continue;
        const lw = localMap.get(rw.id);
        if (!lw) {
          // 新词
          const rec = { ...rw };
          if (!rec.updatedAt) rec.updatedAt = rec.createdAt || nowMs();
          toPut.push(rec);
          localMap.set(rec.id, rec);
          stats.newWords++;
        } else {
          // 已存在，合并
          const merged = mergeWord(lw, rw);
          // 检查是否真的有变化
          const changed = merged.updatedAt !== (lw.updatedAt || lw.createdAt)
                       || merged.imageIds.length !== (lw.imageIds || []).length;
          if (changed) {
            toPut.push(merged);
            localMap.set(merged.id, merged);
            stats.updatedWords++;
          }
        }
      }
      if (toPut.length) {
        await DB.bulkPut('words', toPut);
        // 重建 S.words（保持倒序）
        S.words = [...localMap.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      }
    }

    // ── 文章合并 ──
    if (pack.articles && pack.articles.length) {
      const localIds = new Set(S.articles.map(a => a.id));
      const newArts = pack.articles.filter(a => a.id && !localIds.has(a.id));
      if (newArts.length) {
        await DB.bulkPut('articles', newArts);
        S.articles = S.articles.concat(newArts);
        stats.newArticles = newArts.length;
      }
    }

    // ── 完成 ──
    const parts = [];
    if (stats.newWords)     parts.push(`新增 ${stats.newWords} 个单词`);
    if (stats.updatedWords) parts.push(`更新 ${stats.updatedWords} 个`);
    if (stats.newImages)    parts.push(`新增 ${stats.newImages} 张图`);
    if (stats.newArticles)  parts.push(`新增 ${stats.newArticles} 篇文章`);
    toast(parts.length ? '✅ ' + parts.join('，') : '没有新内容', parts.length ? 'ok' : 'warn');

    renderCreate();
    renderTestHome();
    renderLookup();
    // 只有设置页当前打开着，才刷新它里面的统计数字；从顶部栏触发的同步不该强弹设置页
    if (!$('#settingsModal').hidden) openSettings();

  } catch (e) {
    hideProgress();
    console.error('同步失败', e);
    toast('导入失败：' + (e.message || '文件解析错误'), 'err');
  }
}

const DATA_PATH = 'data.json';

function setSyncStatus(text, type = 'info') {
  const el = $('#davStatus');
  if (!el) return;
  el.className = 'sync-status ' + (type === 'info' ? '' : type);
  el.innerHTML = text;
}
function setSyncProgress(text) {
  const wrap = $('#davProgressWrap');
  const fill = $('#davProgressFill');
  const txt  = $('#davProgress');
  if (!wrap || !fill || !txt) return;
  if (!text) {
    wrap.hidden = true;
    fill.style.width = '0%';
    txt.textContent = '';
    return;
  }
  wrap.hidden = false;
  txt.textContent = text;
  const m = text.match(/(\d+)\s*\/\s*(\d+)/);
  if (m) {
    const pct = Math.round((+m[1] / +m[2]) * 100);
    fill.style.width = pct + '%';
  }
}

/* 把 data.json 里的「图片元数据」和本地的图片对齐 */
async function pullMissingImages(remoteImageIds, onProgress) {
  const localIds = new Set(S.images.map(i => i.id));
  const missing = remoteImageIds.filter(id => !localIds.has(id));
  if (!missing.length) return { downloaded: 0 };

  let ok = 0, fail = 0;
  for (let i = 0; i < missing.length; i++) {
    const id = missing[i];
    if (onProgress) onProgress(i + 1, missing.length);
    try {
      const blob = await WebDAV.getBlob(`${IMG_DIR}/${id}.jpg`);
      if (!blob) { fail++; continue; }
      const rec = { id, name: '', blob, size: blob.size, createdAt: nowMs() };
      await DB.put('images', rec);
      S.images.push(rec);
      S.urls.set(id, URL.createObjectURL(blob));
      Stats.add('cloudDown', blob.size);
      ok++;
    } catch (e) {
      console.warn('下载图片失败', id, e);
      fail++;
    }
  }
  return { downloaded: ok, failed: fail };
}

/* 主同步流程 */
async function syncNow() {
  if (!WebDAV.isConfigured()) {
    setSyncStatus('请先填写并保存配置', 'warn');
    return toast('请先填写并保存坚果云配置', 'warn');
  }

  const btn = $('#davSync');
  if (btn) btn.disabled = true;
  setSyncProgress('');

  try {
    // ─── 1. 下载云端 data.json ───
    setSyncStatus('⏳ 正在读取云端…');
    setSyncProgress('1/4 下载 data.json');
    let remote = null;
    try {
      const r = await WebDAV.getJSON(DATA_PATH);
      remote = r.data;
      if (r.size > 0) Stats.add('cloudDown', r.size);
    } catch (e) {
      // 首次同步，远端可能还没有文件
      if (!/404/.test(e.message)) throw e;
      remote = null;
    }

    const stats = { newWords: 0, updatedWords: 0, newArticles: 0, newImages: 0 };

    // ─── 2. 合并单词 / 文章 ───
    if (remote) {
      setSyncProgress('2/4 合并单词与文章');

      // 单词
      if (Array.isArray(remote.words) && remote.words.length) {
        const localMap = new Map(S.words.map(w => [w.id, w]));
        const toPut = [];
        for (const rw of remote.words) {
          if (!rw.id) continue;
          const lw = localMap.get(rw.id);
          if (!lw) {
            const rec = { ...rw };
            if (!rec.updatedAt) rec.updatedAt = rec.createdAt || nowMs();
            toPut.push(rec);
            localMap.set(rec.id, rec);
            stats.newWords++;
          } else {
            const merged = mergeWord(lw, rw);
            const lAt = lw.updatedAt || lw.createdAt || 0;
            const changed = merged.updatedAt !== lAt
                         || merged.imageIds.length !== (lw.imageIds || []).length;
            if (changed) {
              toPut.push(merged);
              localMap.set(merged.id, merged);
              stats.updatedWords++;
            }
          }
        }
        if (toPut.length) {
          await DB.bulkPut('words', toPut);
          S.words = [...localMap.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        }
      }

      // 文章
      if (Array.isArray(remote.articles) && remote.articles.length) {
        const localIds = new Set(S.articles.map(a => a.id));
        const newArts = remote.articles.filter(a => a.id && !localIds.has(a.id));
        if (newArts.length) {
          await DB.bulkPut('articles', newArts);
          S.articles = S.articles.concat(newArts);
          stats.newArticles = newArts.length;
        }
      }

      // ─── 3. 补下缺失的图片 ───
      const remoteImgIds = Array.isArray(remote.images)
        ? remote.images.map(i => i.id).filter(Boolean)
        : [];
      if (remoteImgIds.length) {
        setSyncProgress(`3/4 检查图片…`);
        const r = await pullMissingImages(remoteImgIds, (cur, total) => {
          setSyncProgress(`3/4 下载图片 ${cur}/${total}`);
        });
        stats.newImages = r.downloaded;
      }
    } else {
      setSyncProgress('2/4 云端暂无数据（首次同步）');
    }

    // ─── 4. 上传：data.json + 缺失的图片 ───
    setSyncProgress('4/4 上传本地数据…');
    await WebDAV.ensureDir(IMG_DIR);
    // 4a. 先传图片（先上传再写 data.json，避免 data.json 引用到不存在的图片）
    const remoteImgSet = new Set(
      remote && Array.isArray(remote.images) ? remote.images.map(i => i.id) : []
    );
    const toUploadImgs = S.images.filter(im => !remoteImgSet.has(im.id));
    if (toUploadImgs.length) {
      for (let i = 0; i < toUploadImgs.length; i++) {
        const im = toUploadImgs[i];
        setSyncProgress(`4/4 上传图片 ${i + 1}/${toUploadImgs.length}`);
        try {
          await WebDAV.putBlob(`${IMG_DIR}/${im.id}.jpg`, im.blob);
          Stats.add('cloudUp', im.blob.size);
        } catch (e) {
          console.warn('上传图片失败', im.id, e);
        }
      }
    }

    // 4b. 拼 data.json 并上传
    const dataPack = {
      app: 'LexiVault',
      schemaVersion: SCHEMA_VERSION,
      sourceDevice: 'mobile',
      exportedAt: nowMs(),
      words: S.words,
      articles: S.articles,
      images: S.images.map(im => ({
        id: im.id,
        name: im.name || '',
        size: im.size || 0,
        createdAt: im.createdAt || nowMs(),
      })),
    };
    const putResult = await WebDAV.putJSON(DATA_PATH, dataPack);
    Stats.add('cloudUp', putResult.size);

    // ─── 完成 ───
    S.settings.lastSyncAt = nowMs();
    saveSettings();

    const parts = [];
    if (stats.newWords)     parts.push(`新增 ${stats.newWords} 词`);
    if (stats.updatedWords) parts.push(`更新 ${stats.updatedWords} 词`);
    if (stats.newImages)    parts.push(`下载 ${stats.newImages} 图`);
    if (stats.newArticles)  parts.push(`新增 ${stats.newArticles} 篇文章`);
    const upCount = toUploadImgs.length;
    if (upCount)            parts.push(`上传 ${upCount} 图`);

    const summary = parts.length ? parts.join('，') : '数据已是最新';
    setSyncStatus(`✅ 同步成功 · ${summary}`, 'ok');
    setSyncProgress('');
    toast('✅ 同步完成', 'ok');

    renderCreate();
    renderTestHome();
    renderLookup();
    openSettings();   // 刷新设置页里的统计数字

  } catch (e) {
    console.error('同步失败', e);
    let hint = e.message || String(e);
    if (/Failed to fetch|NetworkError|CORS/i.test(hint)) {
      hint += '（可能是网络问题或跨域限制）';
    }
    setSyncStatus('❌ 同步失败：' + esc(hint), 'err');
    setSyncProgress('');
    toast('同步失败：' + hint, 'err');
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* ── 清空 ── */
async function clearAllData() {
  if (!confirm('清空手机上的所有数据？\n\n包括单词、图片、文章、设置。\n此操作不可恢复。')) return;
  if (!confirm('再次确认：真的要清空吗？')) return;
  await Promise.all([DB.clear('words'), DB.clear('images'), DB.clear('articles')]);
  clearTestProgress();               // ★ 清学习、复习两份存档
  S.savedLearnProgress = null;
  S.savedReviewProgress = null;
  S.urls.forEach(u => URL.revokeObjectURL(u));
  S.urls.clear();
  S.words = []; S.images = []; S.articles = [];
  // ★ 保留 WebDAV 配置，只重置其他设置
  const keepWebdav = S.settings.webdav;
  const keepSyncAt = S.settings.lastSyncAt;
  S.settings = { ...DEFAULT_SETTINGS, webdav: keepWebdav, lastSyncAt: keepSyncAt };
  saveSettings();
  renderCreate();
  renderTestHome();
  renderLookup();
  toast('已清空', 'ok');
  closeSettings();
}

    const box = modal.querySelector('.modal-box');
    const handle = modal.querySelector('.close-bar');
    if (!box || !handle) return;
    let startY = 0, currentY = 0, dragging = false;
    const reset = () => {
      box.style.transition = '';
      box.style.transform = '';
      modal.style.background = '';
      dragging = false;
    };
    handle.addEventListener('pointerdown', e => {
      dragging = true;
      startY = e.clientY;
      currentY = startY;
      box.style.transition = 'none';
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    });
    handle.addEventListener('pointermove', e => {
      if (!dragging) return;
      currentY = e.clientY;
      const dy = currentY - startY;
      if (dy > 0) {
        box.style.transform = `translateY(${dy}px)`;
        modal.style.background = `rgba(0,0,0,${Math.max(0.08, 0.6 - dy / 800)})`;

      if (!dragging) return;

      if (dy > 80) {

        box.style.transform = 'translateY(100%)';
        setTimeout(() => { modal.hidden = true; reset(); }, 200);

  $('#btnOpenZhipu').addEventListener('click', () => openSubModal('zhipu'));
  $('#btnOpenImg').addEventListener('click', () => openSubModal('img'));
  $('#btnOpenOverview').addEventListener('click', () => openSubModal('overview'));
  // （旧的 davSave / davTest / davSync 三处绑定已删除。
  //  这三个按钮是「坚果云同步」子弹窗打开时才动态生成的，openSubModal('dav') 里已经自己绑好了；
  //  在这里绑定时页面还没有这些元素，会对 null 调 addEventListener 报错，
  //  导致 bindEvents 从这里中断，后面的数据加载、界面渲染全都跑不到。）
}

/* ══════════════════════════════════════════════
   §8  启动
   ══════════════════════════════════════════════ */
/* ══════════════════════════════════════════════
   §7.5  手机返回键 / 侧滑拦截
   ══════════════════════════════════════════════ */
let _atQuiz = false;          // 当前 history 栈顶是不是我们压的「答题层」
let _suppressNextPopstate = false;  // ★ 抑制下一次 popstate（防止返回键触发退出框）

/* 系统返回键触发的"退回上一级"——和左上角「←」做一样的事 */
function doQuizBackFromSystem() {
  const curMode = (T.mode === 'review') ? 'review' : 'learn';
  saveTestProgress();
  if (curMode === 'review') {
    S.savedReviewProgress = loadTestProgress('review');
  } else {
    S.savedLearnProgress = loadTestProgress('learn');
  }
  $('#testRun').hidden = true;
  $('#testResult').hidden = true;
  $('#testSetup').hidden = false;
  updateExitButton();
  renderTestHome();
  toast('已保存进度，下次可继续', 'ok');
}

/* ★ --app-h：拼写题锁死、其他题实时跟随 */
let _appHLocked = false;    // 拼写题里键盘弹出后是否已锁死
let _spellLockOn = false;   // 当前是不是拼写题（决定 --app-h 是否锁）
function initKeyboardWatcher() {
  const root = document.documentElement;
  let fullH = window.innerHeight;
  root.style.setProperty('--app-h', fullH + 'px');

  const update = () => {
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;

    if (!_spellLockOn) {
      // 非拼写题：跟着键盘实时走
      root.style.setProperty('--app-h', h + 'px');
      return;
    }

    // 拼写题：只在首次键盘弹出时锁死
    if (_appHLocked) return;
    if (h < fullH - 150) {
      _appHLocked = true;
      root.style.setProperty('--app-h', h + 'px');
    }
  };

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', update);
  }
  window.addEventListener('orientationchange', () => {
    _appHLocked = false;
    setTimeout(() => {
      fullH = window.innerHeight;                        // ★ 横竖屏切换后重新读高度
      root.style.setProperty('--app-h', fullH + 'px');
      update();
    }, 400);
  });
}

let _exitingApp = false;   // ★ 用户已确认退出：下一次 popstate 直接放行，不再弹框

function initBackGuard() {
  // 首次进入：压一层守卫
  history.pushState({ guard: true }, '');

  window.addEventListener('popstate', e => {
    // ★ 用户已确认退出 → 放行这次，让浏览器/PWA 自己处理
    if (_exitingApp) {
      _exitingApp = false;
      return;
    }
    // ★ 左上角返回键触发的回退 → 忽略，不再弹退出框
    if (_suppressNextPopstate) {
      _suppressNextPopstate = false;
      return;
    }

    // ① 如果当前有打开的弹窗 → 只关最上面那个，不退出页面
    const openModalId = MODAL_IDS.find(id => {
      const el = document.getElementById(id);
      return el && !el.hidden;
    });
    if (openModalId) {
      closeModal(openModalId);
      return;
    }

    // ② 答题中 → 保存进度，回测试首页
    if (_atQuiz) {
      _atQuiz = false;
      doQuizBackFromSystem();
      return;
    }

    // ③ 主界面 → 弹“退出应用”确认框
    showExitAppConfirm();
  });

  // “退出应用”确认框按钮
  const noBtn = document.getElementById('exitAppNo');
  const yesBtn = document.getElementById('exitAppYes');
  const exitModal = document.getElementById('exitAppModal');
  if (noBtn) noBtn.onclick = () => {
    // 点"否"：只关框（守卫层已由 showExitAppConfirm 补好）
    exitModal.hidden = true;
  };
  if (yesBtn) yesBtn.onclick = () => {
    // 点"是"：标记 + 让浏览器真正回退一次
    exitModal.hidden = true;
    _exitingApp = true;
    history.back();
  };
}

function showExitAppConfirm() {
  const el = document.getElementById('exitAppModal');
  if (el) {
    el.hidden = false;
    // ★ 重新压一层守卫，保证用户点"否"后再按返回还能弹框
    history.pushState({ guard: true }, '');
  }
}

/* ★ 拼写页专用：输入框一失焦，立刻抢回焦点（防止键盘被安卓系统收起） */
function initSpellFocusGuard() {
  document.addEventListener('focusout', (e) => {
    if (!e.target || e.target.id !== 'spellInput') return;
    // 下一帧检查：如果焦点落到 body，说明是"点音频键"引起的，立即抢回
    setTimeout(() => {
      const a = document.activeElement;
      if (!a || a === document.body || a === document.documentElement) {
        const inp = document.getElementById('spellInput');
        if (inp) {
          try { inp.focus({ preventScroll: true }); } catch (err) { inp.focus(); }
        }
      }
    }, 0);
  }, true);
}

/* ★ 答题模式下：禁止浏览器把整个页面偷偷滚动 */
function initNoScrollGuard() {
  window.addEventListener('scroll', () => {
    if (!document.body.classList.contains('test-mode')) return;
    if (window.scrollY !== 0 || window.scrollX !== 0) {
      window.scrollTo(0, 0);
    }
  }, { passive: true });
}

async function boot() {
  bindEvents();

  // ★ 先画一遍骨架（数据还没到位，先用空数据把界面画出来），让第一帧就完整
  applySettings();
  refreshThemeButtons();
  refreshLookupModeUI();
  renderCreate();
  renderLibrary();
  renderTestHome();
  renderLookup();
  switchView('create');

  try {
    const [w, i, a] = await Promise.all([
      DB.getAll('words'), DB.getAll('images'), DB.getAll('articles'),
    ]);
    S.words = w.sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
    S.images = i;
    S.articles = a;
    // 预生成图片 URL
    S.images.forEach(im => { if (im.blob) S.urls.set(im.id, URL.createObjectURL(im.blob)); });

    // ★ 断点续传：学习、复习各读一份
    S.savedLearnProgress  = loadTestProgress('learn');
    S.savedReviewProgress = loadTestProgress('review');

    // ★ 一次性迁移：把老数据补齐到新模型（learnProgress 归一化为 0/1）
    for (const w of S.words) {
      if (!w.srs) continue;
      let changed = false;
      // 有 learnProgress 但没 baseRetention → 用老答对率当 baseRetention
      if (w.srs.learnProgress !== undefined && w.srs.baseRetention === undefined) {
        if (w.srs.learnProgress > 0) {
          w.srs.baseRetention = w.srs.learnProgress;
          w.srs.learnProgress = 1;   // 学过 → 归一化 1
        } else {
          w.srs.baseRetention = 0;
          w.srs.learnProgress = 0;
        }
        changed = true;
      }
      // 有 baseRetention 但 learnProgress 不是 0/1 → 归一化
      if (w.srs.baseRetention !== undefined && w.srs.learnProgress !== 0 && w.srs.learnProgress !== 1) {
        w.srs.learnProgress = w.srs.baseRetention > 0 ? 1 : 0;
        changed = true;
      }
      // 完全没记录 → 视为没学过
      if (w.srs.learnProgress === undefined && w.srs.baseRetention === undefined) {
        w.srs.learnProgress = 0;
        w.srs.baseRetention = 0;
        changed = true;
      }
      if (changed) {
        try { await DB.put('words', w); } catch (e) {}
      }
    }
  } catch (e) {
    console.error('数据加载失败', e);
    toast('本地数据加载失败（可能是隐私模式）', 'err');
  }

  applySettings();
  refreshThemeButtons();
  refreshLookupModeUI();
  renderCreate();
  renderLibrary();
  renderTestHome();
  renderLookup();
  switchView('create');
  console.log(`[LexiVault Mobile] v${APP_VERSION} 已启动 · 单词 ${S.words.length} · 图片 ${S.images.length}`);
  initKeyboardWatcher();
  initSpellFocusGuard();
  initNoScrollGuard();
  initBackGuard();
}

boot();

// 注册 Service Worker（PWA）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('[LexiVault] Service Worker 已注册'))
      .catch(e => console.warn('[LexiVault] SW 注册失败', e));
  });
}
</script>
