<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>LexiVault · 移动版</title>
<link rel="manifest" href="manifest.json">
<script>
/* 主题预注入：在 CSS 首帧前就设好颜色，避免暗色闪一下 */
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('lexivault.mobile.settings') || '{}');
    var theme = s.theme || 'dark';
    var T = {
      dark:  { bg:'#0a0a12', surface:'#14141f', text:'#eaeaf5' },
      light: { bg:'#eef0f7', surface:'#ffffff', text:'#16161f' },
      glass: { bg:'#0a1a14', surface:'#12241c', text:'#e6f2ec' }
    };
    var t = T[theme] || T.dark;
    function hex2rgb(h){
      h = h.replace('#','');
      if (h.length === 3) h = h.split('').map(function(c){return c+c;}).join('');
      var n = parseInt(h,16);
      return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
    }
    var r = document.documentElement.style;
    r.setProperty('--bg', t.bg);
    r.setProperty('--surface', t.surface);
    r.setProperty('--surface-rgb', hex2rgb(t.surface));
    r.setProperty('--text', t.text);
    r.setProperty('--text-rgb', hex2rgb(t.text));
    r.colorScheme = (theme === 'light') ? 'light' : 'dark';
  } catch(e){}
})();
</script>
<style>
/* ═══════════ 基础 ═══════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#7c5cff; --accent-rgb:124,92,255;
  --accent2:#22d3ee; --accent2-rgb:34,211,238;
  --bg:#0a0a12; --surface:#14141f; --surface-rgb:20,20,31; --surface2:#1b1b28;
  --text:#eaeaf5; --text-rgb:234,234,245; --muted:#8b8ba7;
  --radius:16px; --img-radius:14px; --blur:16px; --font-size:16px;
  --border:rgba(234,234,245,.09);
  --shadow:0 14px 34px -14px rgba(0,0,0,.7);
  --overlay:rgba(0,0,0,.6);
  --glow-a:rgba(124,92,255,.18);
  --glow-b:rgba(34,211,238,.12);
  --glow-c:rgba(124,92,255,.06);
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-top:max(env(safe-area-inset-top,0px),36px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --tabbar-h:64px;
}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:var(--font-size);line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom));
  touch-action:manipulation;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(700px 420px at 10% -6%,var(--glow-a),transparent 62%),
    radial-gradient(600px 400px at 100% 4%,var(--glow-b),transparent 62%),
    radial-gradient(600px 600px at 50% 110%,var(--glow-c),transparent 60%);
}
::-webkit-scrollbar{width:0;height:0}

/* ★ 加固 [hidden]：防止任何 display 声明把它覆盖掉 */
[hidden]{display:none!important}

/* ★ 测试模式：顶栏 + 底部导航全隐藏，让题目占满全屏 */
body.test-mode .topbar,
body.test-mode .tabbar{display:none!important}
body.test-mode{
  padding-bottom:0;
  overflow:hidden;
  position:fixed;
  top:0;
  left:0;
  right:0;
  width:100%;
  /* ★ 高度锁到 --app-h（拼写题键盘弹出时被锁死的那个值），
     这样键盘收起 → 视口变大 → body 不跟着变 → 画面不抖。
     非拼写题时 --app-h 本来就跟着视口走，也不影响。 */
  height:var(--app-h, 100dvh);
}
body.test-mode .content{padding:0}

/* ★ 测试模式：题目区占满全屏，卡片从状态栏下方一直撑到底部 */
body.test-mode #view-test{
  display:flex;
  flex-direction:column;
  height:var(--app-h, 100dvh);
  min-height:0;
  padding:calc(var(--safe-top) + 8px) 16px calc(var(--safe-bottom) + 8px);
  box-sizing:border-box;
}
body.test-mode #testRun{
  flex:1;
  display:flex;
  flex-direction:column;
}
body.test-mode #testRun > .quiz-card{
  flex:1;
  display:flex;
  flex-direction:column;
}
/* ★ 隐藏所有进度标题（第 X / Y 题 · 题型） */
body.test-mode .quiz-progress{display:none!important}
/* ★ 图片组自动沉到卡片底部 */
body.test-mode .quiz-grid{margin-top:auto}
/* ★ 卡片相对定位，给返回按钮定位用 */
body.test-mode .quiz-card{position:relative}
/* ★ 例句区域下移到卡片中上部 */
body.test-mode .quiz-card > .example-sentence{margin-top:auto}
/* ★ 卡片顶部工具条：返回（左）+ 详情（右） */
.quiz-topbar{
  position:absolute;
  top:2px;left:2px;right:2px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:5;
  pointer-events:none;
}
.quiz-topbar > *{pointer-events:auto}
.quiz-icon-btn{
  width:44px;height:44px;
  border:none;background:transparent;
  color:var(--muted);cursor:pointer;
  display:grid;place-items:center;padding:0;
  transition:color .2s var(--ease),transform .2s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.quiz-icon-btn svg{width:22px;height:22px}
.quiz-icon-btn:active{color:var(--accent);transform:scale(.92)}
.quiz-icon-spacer{width:44px;height:44px}

/* ★ 看词选中文：单词居中、选项靠下 */
.cz-body{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.cz-word-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding-top:8px;
}
.cz-choices{padding-bottom:16px}

/* ★ 看词选图：单词居中 + 无框提示图标 */
.choice-center{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:0;
  padding-top:20px;
  padding-bottom:6px;
}
.choice-hint-icon{
  border:none;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  padding:0;
  width:44px;height:44px;
  display:grid;place-items:center;
  margin-top:6px;
  transition:color .2s var(--ease),transform .2s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.choice-hint-icon svg{width:24px;height:24px}
.choice-hint-icon:active{color:var(--accent);transform:scale(.92)}
/* ★ 喇叭按钮：无框、只有图标、贴例句左下方 */
.quiz-speak{
  border:none;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  padding:0;
  width:36px;height:36px;
  display:grid;place-items:center;
  align-self:flex-start;
  margin-top:2px;
  transition:color .2s var(--ease),transform .2s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.quiz-speak svg{width:22px;height:22px}
.quiz-speak:active{color:var(--accent);transform:scale(.92)}


/* ═══════════ 顶部栏 ═══════════ */
.topbar{
  position:sticky;top:0;z-index:20;
  padding:calc(var(--safe-top) + 14px) 18px 12px;
  display:flex;align-items:center;gap:12px;
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  background:rgba(var(--surface-rgb),.72);
  border-bottom:1px solid var(--border);
}
.topbar-body{flex:1;min-width:0}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  width:40px;height:40px;flex-shrink:0;border-radius:12px;border:1px solid var(--border);
  background:rgba(var(--text-rgb),.05);color:var(--muted);cursor:pointer;
  display:grid;place-items:center;transition:all .22s var(--ease);font-family:inherit;
}
.icon-btn:active{transform:scale(.92);background:rgba(var(--accent-rgb),.16);color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.spinning svg{animation:spinIcon .8s linear infinite}
@keyframes spinIcon{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ═══════════ 内容区 ═══════════ */
.content{position:relative;z-index:1;padding:16px 16px 30px}
.view{display:none}
.view.active{display:block;animation:fadeUp .35s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══════════ 卡片 & 组件 ═══════════ */
.card{
  background:rgba(var(--surface-rgb),.78);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);
  margin-bottom:14px;
}
.card h3{font-size:15px;font-weight:650;margin-bottom:6px}
.card .muted{color:var(--muted);font-size:13px;line-height:1.7}
.muted{color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:12px;border:1px solid var(--border);
  background:rgba(var(--text-rgb),.055);color:var(--text);font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .2s var(--ease);white-space:nowrap;
  min-height:44px;
}
.btn:active{transform:scale(.97);background:rgba(var(--text-rgb),.1)}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;
  box-shadow:0 8px 22px -10px rgba(var(--accent-rgb),1);
}
.btn.primary:active{filter:brightness(1.05);transform:scale(.97)}
.btn.block{width:100%}
.btn.lg{padding:15px 22px;font-size:16px;min-height:52px}

/* 施工中占位 */
.placeholder{
  text-align:center;padding:56px 20px;
}
.placeholder .big{font-size:52px;margin-bottom:14px;opacity:.5}
.placeholder h3{font-size:17px;font-weight:700;margin-bottom:8px}
.placeholder p{font-size:13.5px;color:var(--muted);line-height:1.8;max-width:280px;margin:0 auto}
.placeholder .tag{
  display:inline-block;margin-top:14px;padding:4px 12px;border-radius:99px;
  font-size:11.5px;font-weight:700;letter-spacing:.5px;
  background:rgba(var(--accent-rgb),.14);color:var(--accent);
}

/* ═══════════ 底部导航 ═══════════ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  height:calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(var(--surface-rgb),.88);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border-top:1px solid var(--border);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:none;background:transparent;color:var(--muted);
  font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:color .22s var(--ease);position:relative;
  padding:8px 4px;
}
.tab svg{width:22px;height:22px;stroke-width:1.9}
.tab:active{background:rgba(var(--text-rgb),.04)}
.tab.active{color:var(--accent)}
.tab.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:32px;height:3px;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 2px 10px rgba(var(--accent-rgb),.9);
}

/* ═══════════ 弹窗 ═══════════ */
.modal{
  position:fixed;inset:0;z-index:9998;background:var(--overlay);
  display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(6px);
  animation:fadeIn .22s var(--ease);
}
.modal[hidden]{display:none!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  width:100%;max-width:520px;max-height:85vh;overflow-y:auto;
  padding:24px 20px calc(24px + var(--safe-bottom));
  background:var(--surface);border:1px solid var(--border);
  border-radius:22px 22px 0 0;
  animation:slideUp .3s var(--ease);
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-box h3{font-size:17px;margin-bottom:14px;font-weight:700}
.modal-box .close-bar{
  width:36px;height:4px;border-radius:99px;background:rgba(var(--text-rgb),.28);
  margin:-10px auto 16px;
  position:relative;cursor:grab;touch-action:none;
}
.modal-box .close-bar::before{
  content:'';position:absolute;inset:-14px -30px;
}
.modal-box .close-bar:active{cursor:grabbing;background:rgba(var(--text-rgb),.45)}
.about-row{
  display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--border);font-size:14px;
}
.about-row:last-child{border-bottom:none}
.about-row .k{color:var(--muted)}
.about-row .v{font-weight:600;font-variant-numeric:tabular-nums}

/* ═══════════ 表单 ═══════════ */
label{display:block;font-size:12.5px;color:var(--muted);margin:16px 0 8px;font-weight:600;letter-spacing:.3px}
label:first-of-type{margin-top:0}
.input{
  width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--border);
  background:rgba(var(--text-rgb),.05);color:var(--text);font-family:inherit;
  font-size:16px;outline:none;transition:all .22s var(--ease);-webkit-appearance:none;
}
.input:focus{border-color:var(--accent);background:rgba(var(--text-rgb),.08);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16)}

/* 释义行 */
.meanings-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.meaning-row{display:flex;gap:8px;align-items:center}
.pos-select{
  width:92px;flex-shrink:0;padding:12px 30px 12px 12px;font-size:14px;
  border-radius:12px;border:1px solid var(--border);
  background:rgba(var(--text-rgb),.05) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b8ba7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E") no-repeat right 8px center;
  background-size:16px;color:var(--text);font-family:inherit;outline:none;
  -webkit-appearance:none;cursor:pointer;
}
.pos-select:focus{border-color:var(--accent)}
.meaning-input{
  flex:1;min-width:0;padding:12px 14px;font-size:16px;
  border-radius:12px;border:1px solid var(--border);
  background:rgba(var(--text-rgb),.05);color:var(--text);font-family:inherit;
  outline:none;transition:all .22s var(--ease);-webkit-appearance:none;
}
.meaning-input:focus{border-color:var(--accent);background:rgba(var(--text-rgb),.08);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16)}
.remove-mean{
  width:40px;height:40px;flex-shrink:0;border-radius:11px;
  background:rgba(255,107,129,.12);color:#ff6b81;border:none;
  cursor:pointer;font-size:15px;display:grid;place-items:center;font-weight:700;
  transition:all .2s var(--ease);
}
.remove-mean:active{background:rgba(255,107,129,.25);transform:scale(.94)}

/* 图片网格 */
.img-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:10px;margin-bottom:12px;
}
.img-empty{
  grid-column:1/-1;text-align:center;padding:26px 12px;color:var(--muted);
  font-size:13px;border:1.5px dashed var(--border);border-radius:12px;
}
.img-cell{
  position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;
  border:1px solid var(--border);background:rgba(var(--text-rgb),.05);
  animation:fadeUp .3s var(--ease);
}
.img-cell img{width:100%;height:100%;object-fit:cover;display:block}
.img-remove{
  position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:8px;
  background:rgba(0,0,0,.65);color:#fff;border:none;cursor:pointer;
  display:grid;place-items:center;font-size:13px;backdrop-filter:blur(6px);
}
.img-remove:active{background:#ff6b81}

.img-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.img-actions .btn{padding:13px 12px;font-size:14px}
.img-actions .btn svg{width:18px;height:18px}

/* ═══════════ 测试 ═══════════ */
.quiz-progress{
  text-align:center;font-size:12.5px;color:var(--muted);
  letter-spacing:1.2px;margin-bottom:14px;font-weight:600;
}
.quiz-card{
  padding:18px;border-radius:calc(var(--radius) + 4px);
  border:1px solid var(--border);background:rgba(var(--surface-rgb),.8);
  box-shadow:var(--shadow);animation:fadeUp .35s var(--ease);
}
/* ★ 测试模式下卡片铺满，图片组沉底 */
body.test-mode #testRun > .quiz-card{
  padding:20px 18px 18px;
  overflow:hidden;
}
/* ★ 学习卡：内容区可滚动，底部按钮固定 */
.lc-scroll-body{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:4px;
}
.lc-next-fixed{
  flex-shrink:0;
  margin-top:14px;
}
.quiz-img{
  width:100%;max-height:28vh;object-fit:contain;
  border-radius:var(--img-radius);background:rgba(var(--text-rgb),.05);
  display:block;margin:0 auto;
}

/* ═══════════ 拼写题专用（看图拼词 / 看中拼英文） ═══════════ */
body.test-mode .spell-card{
  display:flex;
  flex-direction:column;
  min-height:0;
  padding:62px 0 10px;
}
.spell-img-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  flex-shrink:0;
  margin-top:48px;
  border-radius:var(--img-radius);
  overflow:hidden;
  background:rgba(var(--text-rgb),.05);
}
.spell-img-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.spell-spacer{
  flex:1 1 0;
  min-height:10px;
}
.spell-speak-btn{
  width:44px;
  height:44px;
  flex-shrink:0;
  align-self:center;
  border:none;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:color .2s var(--ease),transform .2s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.spell-speak-btn svg{width:26px;height:26px}
.spell-speak-btn:active{color:var(--accent);transform:scale(.92)}
.spell-img-cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:8px 12px 9px;
  background:linear-gradient(to top,
    rgba(0,0,0,.9) 0%,
    rgba(0,0,0,.68) 60%,
    rgba(0,0,0,0) 100%);
  color:#fff;font-size:12.5px;font-weight:700;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,0,0,.55);
  pointer-events:none;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

/* ═══ 拼写阶段（看图拼词 / 看中文拼英文）═══ */
.spell-input-bare{
  width:100%;
  min-height:64px;
  padding:10px 0;
  text-align:center;
  font-size:38px;
  font-weight:800;
  letter-spacing:4px;
  border:none;
  background:transparent;
  color:var(--text);
  caret-color:var(--accent);
  outline:none;
  font-family:inherit;
  -webkit-appearance:none;
  border-radius:0;
}
.spell-input-bare:focus{
  border:none;
  background:transparent;
  box-shadow:none;
  outline:none;
}
.spell-input-bare::placeholder{color:transparent}
.spell-input-bare.ok{color:#3ddc97}
.spell-input-bare.bad{
  color:#ff6b81;
  animation:shake .4s;
}
.spell-rev-zh{
  text-align:center;
  font-size:17px;
  line-height:1.75;
  color:var(--text);
  padding:14px 12px 4px;
  word-break:break-word;
}
.spell-rev-zh .rev-pos{
  color:var(--accent);
  font-style:italic;
  font-weight:800;
  font-size:13px;
  margin-right:4px;
}

.quiz-word{
  font-size:38px;font-weight:800;text-align:center;
  letter-spacing:-.8px;margin:6px 0 10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  word-break:break-all;
}
.quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.quiz-opt{
  position:relative;
  border:3px solid transparent;border-radius:14px;overflow:hidden;
  cursor:pointer;aspect-ratio:1;background:rgba(var(--text-rgb),.05);
  transition:all .22s var(--ease);padding:0;
}
.quiz-opt img{width:100%;height:100%;object-fit:cover;display:block}
/* 图片底部的释义条（百词斩风格） */
.quiz-opt-cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:6px 9px 7px;
  background:linear-gradient(to top,
    rgba(0,0,0,.88) 0%,
    rgba(0,0,0,.72) 55%,
    rgba(0,0,0,.32) 85%,
    rgba(0,0,0,0) 100%);
  color:#fff;font-size:11.5px;font-weight:600;line-height:1.35;
  text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}
.quiz-opt:active{transform:scale(.97)}
.quiz-opt.ok{border-color:#3ddc97;box-shadow:0 0 0 4px rgba(61,220,151,.22)}
.quiz-opt.bad{border-color:#ff6b81;box-shadow:0 0 0 4px rgba(255,107,129,.22);opacity:.6}
.rev-meaning{
  padding:14px 16px;text-align:center;font-size:16px;color:var(--text);
  background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accent-rgb),.22);
  border-radius:12px;line-height:1.7;
}
.rev-meaning i.rev-pos{color:var(--accent);font-style:italic;font-weight:700;font-size:13px;margin-right:5px}
/* 看例句选图：例句无框无线、纯文字（模仿百词斩学习第一步） */
.example-sentence{
  text-align:left;
  font-size:18px;
  font-weight:600;
  line-height:1.75;
  padding:6px 2px 4px;
  color:var(--text);
  background:transparent;
  border:none;
}
.hl-word{color:var(--accent);font-weight:800;font-style:normal}
/* 例句里可点击的单词（查词用） */
.glance-word{
  cursor:pointer;
  border-bottom:1px dashed rgba(var(--text-rgb),.22);
  padding-bottom:1px;
  transition:background .15s var(--ease),color .15s var(--ease);
}
.glance-word:active{
  background:rgba(var(--accent-rgb),.2);
  color:var(--accent);
  border-bottom-color:transparent;
}

/* ═══════════ 全屏单词详情（下滑打开 / 上滑关闭） ═══════════ */
.word-sheet{
  position:fixed;
  left:0;right:0;
  top:var(--topbar-actual-h, 100px);                      /* 顶部栏下方 */
  bottom:calc(var(--tabbar-h) + var(--safe-bottom));      /* 底部导航上方 */
  z-index:9997;
  background:var(--bg);
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transform:translateY(20px);
  transition:opacity .3s var(--ease),transform .34s cubic-bezier(.22,1,.36,1);
}
.word-sheet.open{opacity:1;pointer-events:auto;transform:translateY(0)}
.word-sheet-panel{
  flex:1;
  width:100%;max-width:640px;
  margin:0 auto;
  padding:16px 18px 20px;
  overscroll-behavior:contain;
  display:flex;
  flex-direction:column;
  min-height:0;
  overflow:hidden;
}
.ws-scroll-body{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.ws-close-fixed{
  flex-shrink:0;
  margin-top:14px;
}
/* ★ 测试模式下：详情页全屏（顶天立地） */
body.test-mode .word-sheet{
  top:0;
  bottom:0;
}
body.test-mode .word-sheet-panel{
  padding-top:calc(var(--safe-top) + 6px);
  padding-bottom:calc(var(--safe-bottom) + 12px);
}
/* ═══ 详情页（不背单词风格）═══ */
.ws-head{
  display:flex;align-items:center;gap:12px;
  padding:4px 0 12px;
  border-bottom:1px solid var(--border);
  margin-bottom:16px;
}
.ws-head .ws-word-wrap{flex:1;min-width:0}
.ws-word{
  font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1.1;
  word-break:break-all;
}
.ws-phon{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--muted);font-size:14px;margin-top:4px;
}
.ws-speak{
  flex-shrink:0;width:44px;height:44px;
  border-radius:50%;border:1px solid var(--border);
  background:rgba(var(--text-rgb),.05);
  color:var(--text);font-size:18px;cursor:pointer;
  display:grid;place-items:center;
  transition:all .2s var(--ease);
}
.ws-speak:active{transform:scale(.92);background:rgba(var(--accent-rgb),.16);color:var(--accent)}
.ws-meanings{display:flex;flex-direction:column;gap:10px}
.ws-mean-row{
  display:flex;gap:6px;align-items:baseline;
  padding-bottom:8px;
  border-bottom:1px dashed var(--border);
}
.ws-mean-row:last-child{border-bottom:none;padding-bottom:0}

/* ★ 可折叠标题 */
.ws-toggle{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.ws-toggle-arrow{
  font-size:11px;color:var(--muted);
  transition:transform .2s var(--ease);
}
.ws-toggle.open .ws-toggle-arrow{transform:rotate(90deg)}
/* ★ 词组折叠列表 */
.ws-phrase-list{padding-top:2px}
.ws-pos{
  flex-shrink:0;font-style:italic;font-weight:800;
  color:var(--accent);font-size:14px;
  min-width:20px;
}
.ws-text{font-size:15.5px;line-height:1.6;flex:1;word-break:break-word}
.ws-section{margin-top:20px}
.ws-section-title{
  font-size:13px;font-weight:800;letter-spacing:.6px;
  color:var(--text);margin-bottom:4px;
}
.ws-sent{padding:5px 0}
.ws-sent + .ws-sent{border-top:1px dashed var(--border)}
.ws-sent-en{
  font-size:15px;font-weight:600;line-height:1.6;
  color:var(--text);word-break:break-word;
}
.ws-sent-cn{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.55}
.ws-phrase{
  font-size:14px;line-height:1.7;color:var(--text);
  padding:5px 0;word-break:break-word;
}
.ws-phrase + .ws-phrase{border-top:1px dashed var(--border)}
.ws-img{
  width:100%;max-height:40vh;object-fit:contain;
  border-radius:var(--img-radius);
  background:rgba(var(--text-rgb),.04);
  display:block;
}
.quiz-feedback{text-align:center;margin-top:14px;font-size:15px;font-weight:700;min-height:22px}
.quiz-feedback.ok{color:#3ddc97}
.quiz-feedback.bad{color:#ff6b81}

/* 学习卡 */
.learn-card{
  padding:20px 18px;border-radius:calc(var(--radius) + 4px);
  border:2px solid var(--border);background:rgba(var(--surface-rgb),.82);
  box-shadow:var(--shadow);animation:fadeUp .35s var(--ease);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.learn-card.ok{border-color:rgba(61,220,151,.5)}
.learn-card.bad{border-color:rgba(255,107,129,.5)}
.lc-badge{font-size:14px;font-weight:800;letter-spacing:.3px}
.learn-card.ok .lc-badge{color:#3ddc97}
.learn-card.bad .lc-badge{color:#ff6b81}
.lc-phonetic{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--muted);font-size:14px;margin-top:-4px;
  text-align:center;
}

/* 结果页 */
.result-stat{text-align:center;padding:8px 0 4px}
.result-stat .pct{
  font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.result-stat .sub{font-size:13.5px;color:var(--muted);margin-top:8px}
.ret-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ret-item{
  display:flex;align-items:center;gap:10px;padding:10px 13px;
  border-radius:11px;background:rgba(var(--text-rgb),.04);
  border:1px solid var(--border);font-size:13.5px;
}
.ret-item .w{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ret-item .bar{flex-shrink:0;width:70px;height:6px;border-radius:99px;background:rgba(var(--text-rgb),.1);overflow:hidden}
.ret-item .bar i{display:block;height:100%;border-radius:99px;transition:width .5s var(--ease)}
.ret-item .pct2{flex-shrink:0;font-weight:800;font-size:13px;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}

/* ═══════════ 查词 ═══════════ */
.lookup-box{position:relative;margin-bottom:14px}
.lookup-input{
  width:100%;padding:14px 108px 14px 16px;font-size:16px;
  border-radius:14px;border:1px solid var(--border);
  background:rgba(var(--surface-rgb),.85);color:var(--text);
  font-family:inherit;outline:none;transition:all .22s var(--ease);
  -webkit-appearance:none;
}
.lookup-input:focus{
  border-color:var(--accent);background:rgba(var(--surface-rgb),.95);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16);
}
.lookup-clear{
  position:absolute;right:64px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:9px;border:none;
  background:rgba(var(--text-rgb),.1);color:var(--muted);
  cursor:pointer;font-size:13px;display:grid;place-items:center;
  transition:all .2s var(--ease);
}
.lookup-clear:active{background:rgba(255,107,129,.25);color:#ff6b81}
.lookup-mode{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  height:32px;padding:0 10px;border-radius:9px;border:none;
  background:rgba(var(--accent-rgb),.16);color:var(--accent);
  font-family:inherit;font-size:12.5px;font-weight:800;letter-spacing:.3px;
  cursor:pointer;display:grid;place-items:center;white-space:nowrap;
  transition:all .2s var(--ease);min-width:50px;
}
.lookup-mode:active{transform:translateY(-50%) scale(.94)}
.lookup-mode.dict{
  background:rgba(var(--accent2-rgb),.18);color:var(--accent2);
}

.lookup-tip{
  text-align:center;padding:44px 20px;color:var(--muted);
  font-size:13.5px;line-height:1.9;
}
.lookup-tip .big{font-size:44px;opacity:.4;margin-bottom:12px}

.lk-card{
  display:flex;gap:12px;align-items:center;padding:12px;
  border-radius:14px;background:rgba(var(--surface-rgb),.78);
  border:1px solid var(--border);margin-bottom:10px;
  cursor:pointer;transition:all .2s var(--ease);
  animation:fadeUp .3s var(--ease) backwards;
}
.lk-card:active{transform:scale(.98);border-color:rgba(var(--accent-rgb),.5)}
.lk-thumb{
  width:56px;height:56px;flex-shrink:0;border-radius:11px;
  object-fit:cover;background:rgba(var(--text-rgb),.05);
}
.lk-thumb-empty{
  display:grid;place-items:center;font-size:10.5px;color:var(--muted);
  border:1px dashed var(--border);
}
.lk-body{flex:1;min-width:0}
.lk-word{
  font-size:16px;font-weight:800;letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lk-phon{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;color:var(--muted);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lk-mean{
  font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.lk-mean .lk-pos{
  font-style:italic;font-weight:700;color:var(--accent);
  font-size:11.5px;margin-right:3px;
}

/* 查词详情弹窗 */
.lkd-img{
  width:100%;max-height:42vh;object-fit:contain;
  border-radius:var(--img-radius);background:rgba(var(--text-rgb),.04);
  display:block;margin:0 auto 8px;
}
.lkd-word{
  font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.1;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-align:center;word-break:break-all;
}
.lkd-phon{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--muted);font-size:14px;text-align:center;margin-top:2px;
}
.lkd-meanings{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.lkd-mean-row{
  display:flex;gap:10px;align-items:baseline;padding:11px 14px;
  border-radius:12px;background:rgba(var(--text-rgb),.04);
  border:1px solid var(--border);
}
.lkd-pos{
  flex-shrink:0;padding:2px 9px;border-radius:6px;font-size:11px;
  font-weight:800;font-style:italic;
  background:rgba(var(--accent-rgb),.16);color:var(--accent);
}
.lkd-text{font-size:15px;line-height:1.55}
.lkd-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--border);
  font-size:12.5px;color:var(--muted);
}
.lkd-ret{display:flex;align-items:center;gap:6px;font-weight:700}
.lkd-ret .rd{width:7px;height:7px;border-radius:50%}
.lkd-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

/* ═══════════ 词组 / 例句区块 ═══════════ */
.wc-block{
  margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid;
}
.wc-phrases{
  background:rgba(var(--accent-rgb),.06);
  border-color:rgba(var(--accent-rgb),.18);
}
.wc-sentences{
  background:rgba(var(--accent2-rgb),.07);
  border-color:rgba(var(--accent2-rgb),.22);
}
.wc-title{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;font-weight:700;letter-spacing:.3px;margin-bottom:8px;
}
.wc-phrases .wc-title{color:var(--accent)}
.wc-sentences .wc-title{color:var(--accent2)}
.wc-more{
  font-size:11.5px;font-weight:700;color:var(--accent);
  background:rgba(var(--accent-rgb),.12);border:none;
  padding:5px 11px;cursor:pointer;font-family:inherit;border-radius:99px;
  transition:all .2s var(--ease);white-space:nowrap;
}
.wc-more:active{transform:scale(.95);background:rgba(var(--accent-rgb),.24)}
.wc-sentences .wc-more{color:var(--accent2);background:rgba(var(--accent2-rgb),.16)}
.wc-sentences .wc-more:active{background:rgba(var(--accent2-rgb),.3)}
.wc-phrase-list{display:flex;flex-direction:column}
.wc-phrase-line{
  font-size:13px;line-height:1.6;color:var(--text);padding:5px 0;
  word-break:break-word;
}
.wc-phrase-line + .wc-phrase-line{border-top:1px dashed var(--border)}
.sent-row{padding:7px 0}
.sent-row + .sent-row{border-top:1px dashed var(--border)}
.sent-en{
  font-size:14px;font-weight:600;line-height:1.55;
  color:var(--text);word-break:break-word;
}
.sent-cn{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55}
.list-row{
  padding:11px 14px;border-radius:11px;
  background:rgba(var(--text-rgb),.04);
  border:1px solid var(--border);
  font-size:13.5px;line-height:1.6;
  margin-bottom:8px;word-break:break-word;
}
.list-row:last-child{margin-bottom:0}

/* ═══════════ 查词页分组 & 词典卡片 ═══════════ */
.lookup-section-title{
  display:flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:800;letter-spacing:1.4px;
  color:var(--muted);margin:16px 2px 8px;
}
.lookup-section-title:first-child{margin-top:0}
.lookup-section-title span{
  padding:1px 7px;border-radius:99px;font-size:11px;
  background:rgba(var(--text-rgb),.08);color:var(--text);
  letter-spacing:0;font-weight:700;
}
.lk-card-dict{
  background:rgba(var(--accent-rgb),.045);
  border-color:rgba(var(--accent-rgb),.16);
}
.lk-thumb-dict{
  display:grid;place-items:center;font-size:22px;
  background:rgba(var(--accent-rgb),.14);
}

/* 查词卡片上的「＋ 加到词库」按钮 */
.lk-add-btn{
  flex-shrink:0;width:38px;height:38px;
  border-radius:11px;
  border:1px solid rgba(var(--accent-rgb),.3);
  background:rgba(var(--accent-rgb),.12);
  color:var(--accent);
  font-family:inherit;font-size:22px;font-weight:700;line-height:1;
  cursor:pointer;display:grid;place-items:center;
  transition:all .2s var(--ease);
  margin-left:4px;
}
.lk-add-btn:active{
  transform:scale(.92);
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-color:transparent;
  box-shadow:0 6px 18px -8px rgba(var(--accent-rgb),1);
}

/* ═══════════ 测试提示例句 ═══════════ */
.hint-box{
  margin-top:12px;padding:11px 13px;border-radius:11px;
  background:rgba(var(--accent2-rgb),.08);
  border:1px solid rgba(var(--accent2-rgb),.22);
  animation:fadeUp .25s var(--ease);
}
.hint-en{
  font-size:14px;font-weight:600;line-height:1.55;
  color:var(--text);word-break:break-word;
}
.hint-cn{
  font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55;
}

/* ═══════════ 测试首页 ═══════════ */
.test-entry{
  padding:22px 20px;border-radius:var(--radius);
  background:rgba(var(--surface-rgb),.78);
  border:1px solid var(--border);
  margin-bottom:14px;
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  box-shadow:var(--shadow);
}
.test-entry-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:8px;
}
.test-entry-head h3{
  font-size:18px;font-weight:700;margin:0;
}
.test-entry-count{
  font-size:34px;font-weight:800;letter-spacing:-1px;
  line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.test-entry-count small{
  font-size:14px;font-weight:600;color:var(--muted);
  -webkit-text-fill-color:var(--muted);
  margin-left:4px;
}
.test-entry.review .test-entry-count{
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;background-clip:text;
}
.test-entry-sub{
  font-size:12.5px;color:var(--muted);
  margin-bottom:16px;line-height:1.6;
}
.test-entry .btn[disabled]{
  opacity:.42;cursor:not-allowed;
}

/* ═══════════ 测试首页：词库可视化圆环 ═══════════ */
#testSetup{
  display:flex;
  flex-direction:column;
  min-height:calc(100dvh - var(--tabbar-h) - var(--safe-bottom) - var(--safe-top) - 130px);
}
.test-spacer{flex:1;min-height:24px;}

.ring-card{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:26px 16px 20px;
  border-radius:24px;
  background:rgba(var(--surface-rgb),.78);
  border:1px solid var(--border);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  box-shadow:var(--shadow);
  margin-bottom:16px;
  overflow:hidden;
}
.ring-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% 10%,rgba(var(--accent-rgb),.16),transparent 55%),
    radial-gradient(circle at 50% 100%,rgba(var(--accent2-rgb),.12),transparent 55%);
}
.ring-wrap{
  position:relative;
  width:208px;height:208px;
  margin-bottom:20px;
  z-index:1;
}
.ring-svg{
  width:100%;height:100%;display:block;
  transform:rotate(-90deg);
}
.ring-svg circle{fill:none;stroke-linecap:butt;}
.ring-track{stroke:rgba(var(--text-rgb),.06);stroke-width:14;}
.ring-seg{
  stroke-width:14;
  transition:stroke-dasharray 1.25s cubic-bezier(.22,1,.36,1);
}
.ring-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;
}
.ring-total{
  font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ring-total-label{
  font-size:11.5px;color:var(--muted);
  margin-top:6px;font-weight:600;letter-spacing:.6px;
}
.ring-legend{
  position:relative;z-index:1;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;width:100%;
  padding-top:16px;border-top:1px solid var(--border);
}
.legend-item{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:4px;
}
.legend-num{
  font-size:22px;font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.7px;line-height:1;
  color:var(--text);
}
.legend-name{
  font-size:11px;color:var(--muted);font-weight:600;
  display:flex;align-items:center;gap:5px;
}
.legend-dot{
  width:7px;height:7px;border-radius:50%;
  display:inline-block;flex-shrink:0;
}
.legend-dot.learned{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 8px rgba(var(--accent-rgb),.65);
}
.legend-dot.review{
  background:linear-gradient(135deg,#ffd166,#ff8b3d);
  box-shadow:0 0 8px rgba(255,180,60,.55);
}
.legend-dot.new{
  background:rgba(var(--text-rgb),.28);
}

/* ═══════════ 测试首页（卡片式）═══════════ */
.test-entry-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;
}
.test-entry-card{
  position:relative;padding:22px 18px;border-radius:20px;
  border:1px solid var(--border);
  background:rgba(var(--surface-rgb),.78);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  cursor:pointer;text-align:left;font-family:inherit;color:var(--text);
  transition:all .22s var(--ease);
  min-height:170px;
  display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;box-shadow:var(--shadow);
}
.test-entry-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 30% 100%,rgba(var(--accent-rgb),.22),transparent 70%);
}
.test-entry-card.review::before{
  background:radial-gradient(circle at 30% 100%,rgba(var(--accent2-rgb),.22),transparent 70%);
}
.test-entry-card:active{transform:scale(.97)}
.test-entry-card[disabled]{opacity:.42;cursor:not-allowed}
.test-entry-card[disabled]:active{transform:none}
.te-label{
  position:relative;z-index:1;
  font-size:17px;font-weight:700;letter-spacing:-.2px;margin-bottom:6px;
}
.te-count{
  position:relative;z-index:1;
  font-size:44px;font-weight:800;letter-spacing:-1.8px;line-height:1;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.test-entry-card.review .te-count{
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;background-clip:text;
}
.te-sub{
  position:relative;z-index:1;
  font-size:12px;color:var(--muted);margin-top:4px;
  font-weight:600;letter-spacing:.3px;
}

/* 继续上次进度横幅 */
.resume-banner{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;border-radius:16px;
  background:linear-gradient(135deg,rgba(var(--accent-rgb),.16),rgba(var(--accent2-rgb),.12));
  border:1px solid rgba(var(--accent-rgb),.3);
  margin-bottom:14px;
}
.resume-banner[hidden]{display:none!important}
.resume-banner .rb-body{flex:1;min-width:0}
.resume-banner .rb-title{font-size:14px;font-weight:700;margin-bottom:2px}
.resume-banner .rb-sub{font-size:11.5px;color:var(--muted)}
.resume-banner .rb-btn{
  padding:8px 14px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;min-height:36px;flex-shrink:0;
  transition:all .2s var(--ease);
}
.resume-banner .rb-btn:active{transform:scale(.96)}
.resume-banner .rb-btn.ghost{
  background:rgba(var(--text-rgb),.08);
  color:var(--muted);
}

/* ═══════════ 测试滑动特效 ═══════════ */
@keyframes slideInRight{
  from{opacity:0;transform:translateX(60px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes slideOutLeft{
  from{opacity:1;transform:translateX(0)}
  to{opacity:0;transform:translateX(-60px)}
}
.slide-in{animation:slideInRight .32s var(--ease)}
.slide-out{animation:slideOutLeft .28s var(--ease) forwards}

/* ═══════════ 复习选择题 ═══════════ */
.choice-grid{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice-opt{
  padding:14px 18px;border-radius:14px;
  border:2px solid var(--border);
  background:rgba(var(--text-rgb),.04);
  color:var(--text);font-family:inherit;
  cursor:pointer;text-align:left;transition:all .2s var(--ease);
  min-height:64px;
  display:block;
  line-height:1.45;
  overflow:hidden;
  width:100%;
}
.choice-opt .co-pos{
  display:block;
  font-size:13px;
  font-style:italic;
  color:var(--muted);
  margin-bottom:4px;
  font-weight:600;
}
.choice-opt .co-text{
  display:block;
  font-size:17.5px;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.choice-opt:active{transform:scale(.98)}
.choice-opt.ok{
  border-color:#3ddc97;
  background:rgba(61,220,151,.12);
  color:#3ddc97;
}
.choice-opt.bad{
  border-color:#ff6b81;
  background:rgba(255,107,129,.12);
  color:#ff6b81;
  opacity:.7;
}

/* ═══════════ 设置页 ═══════════ */
.set-section{margin-bottom:22px}
.theme-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme-btn{
  padding:14px;border-radius:12px;border:1px solid var(--border);
  background:rgba(var(--text-rgb),.04);color:var(--muted);
  font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
  transition:all .2s var(--ease);min-height:50px;
}
.theme-btn:active{transform:scale(.97)}
.theme-btn.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-color:transparent;
  box-shadow:0 6px 18px -8px rgba(var(--accent-rgb),1);
}
.stage-switch{display:flex;flex-direction:column;gap:8px}
.stage-btn{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:14px 15px;border-radius:13px;
  border:1px solid var(--border);background:rgba(var(--text-rgb),.04);
  color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;
  cursor:pointer;transition:all .2s var(--ease);
  min-height:52px;text-align:left;
}
.stage-btn:active{transform:scale(.98)}
.stage-btn::after{
  content:'○';margin-left:auto;font-size:15px;color:var(--muted);
}
.stage-btn.on{
  border-color:rgba(var(--accent-rgb),.5);
  background:rgba(var(--accent-rgb),.06);
}
.stage-btn.on::after{
  content:'●';color:var(--accent);
}
.set-section:last-child{margin-bottom:0}
.set-title{
  font-size:11.5px;font-weight:800;letter-spacing:1.5px;
  color:var(--accent);margin-bottom:10px;padding-left:2px;
}
.set-btn{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:14px 15px;border-radius:13px;
  border:1px solid var(--border);background:rgba(var(--text-rgb),.04);
  color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;
  cursor:pointer;transition:all .2s var(--ease);
  margin-bottom:8px;text-align:left;min-height:52px;
}
.set-btn:active{transform:scale(.98);background:rgba(var(--text-rgb),.09)}
.set-btn .ico{font-size:19px;flex-shrink:0}
.set-btn .body{flex:1;min-width:0}
.set-btn .body small{
  display:block;font-size:11.5px;color:var(--muted);
  font-weight:500;margin-top:2px;letter-spacing:0;
}
.set-btn.danger{color:#ff7186;border-color:rgba(255,113,134,.28)}
.set-btn.danger:active{background:rgba(255,113,134,.12)}
.set-btn.warn{color:#ffb43c;border-color:rgba(255,180,60,.28)}
.set-btn.warn:active{background:rgba(255,180,60,.12)}

.set-info{
  padding:13px 15px;border-radius:12px;
  background:rgba(var(--text-rgb),.04);border:1px solid var(--border);
  font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px;
}
.set-info b{color:var(--text)}
.set-info.ok{border-color:rgba(61,220,151,.4);color:#3ddc97}
.set-info.ok b{color:#3ddc97}
.set-info.warn{border-color:rgba(255,180,60,.4);color:#ffb43c}
.set-info.warn b{color:#ffb43c}

/* ═══════════ 数据统计 ═══════════ */
.stat-card{
  padding:16px;border-radius:14px;
  background:rgba(var(--text-rgb),.04);
  border:1px solid var(--border);
  margin-bottom:14px;
}
.stat-card h4{
  font-size:14px;font-weight:700;margin-bottom:10px;
}
.stat-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:5px 0;font-size:13.5px;gap:12px;
}
.stat-row .k{color:var(--muted);flex-shrink:0}
.stat-row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.stat-divider{
  height:1px;background:var(--border);margin:10px 0;
}
.stat-note{
  font-size:11.5px;color:var(--muted);line-height:1.65;
  padding:9px 11px;border-radius:9px;
  background:rgba(var(--text-rgb),.035);
  margin-top:10px;
}

/* ═══════════ 总词库 ═══════════ */
.lib-toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.lib-toolbar .lib-search{width:100%}
.lib-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lib-filters select{
  width:100%;padding:11px 32px 11px 14px;font-size:14px;
  border-radius:11px;border:1px solid var(--border);
  background:rgba(var(--text-rgb),.05) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b8ba7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E") no-repeat right 10px center;
  background-size:16px;color:var(--text);
  font-family:inherit;outline:none;-webkit-appearance:none;cursor:pointer;
}
.lib-filters select:focus{border-color:var(--accent)}
.alpha-bar{display:flex;gap:5px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.alpha-bar::-webkit-scrollbar{display:none}
.alpha{
  min-width:30px;height:30px;padding:0 8px;border-radius:9px;
  border:1px solid var(--border);background:rgba(var(--text-rgb),.04);
  color:var(--muted);font-size:12px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:all .2s var(--ease);flex-shrink:0;
  display:grid;place-items:center;
}
.alpha:active{transform:scale(.94)}
.alpha.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-color:transparent;
  box-shadow:0 4px 12px -4px rgba(var(--accent-rgb),1);
}
.alpha.off{opacity:.32}

.word-list{display:flex;flex-direction:column;gap:10px}
.word-item{
  display:flex;gap:12px;padding:12px;border-radius:14px;
  background:rgba(var(--surface-rgb),.78);border:1px solid var(--border);
  cursor:pointer;transition:all .2s var(--ease);
  animation:fadeUp .3s var(--ease) backwards;
  /* ★ 只渲染屏幕内的词条，屏幕外的先跳过，滑到哪渲染到哪。
     100px 是每个词条的估算高度，用来占位，避免滚动时跳动。 */
  content-visibility:auto;
  contain-intrinsic-size:0 100px;
}
.word-item:active{transform:scale(.98);border-color:rgba(var(--accent-rgb),.5)}
.wi-img{
  width:76px;height:76px;flex-shrink:0;border-radius:11px;overflow:hidden;
  background:rgba(var(--text-rgb),.05);
}
.wi-img img{width:100%;height:100%;object-fit:cover;display:block}
.wi-img .no-img{display:grid;place-items:center;height:100%;font-size:10.5px;color:var(--muted)}
.wi-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.wi-word{
  font-size:17px;font-weight:800;letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wi-mean{
  font-size:13px;color:var(--muted);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.wi-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wi-cat{
  padding:2px 8px;border-radius:99px;
  background:rgba(var(--accent-rgb),.16);color:var(--accent);
  font-weight:600;font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;
}
.wi-ret{display:flex;align-items:center;gap:5px;font-weight:700;font-size:11.5px;flex-shrink:0}
.wi-ret .rd{width:6px;height:6px;border-radius:50%}
.lib-empty{
  text-align:center;padding:50px 20px;color:var(--muted);
  font-size:13.5px;line-height:1.9;
}
.lib-empty .big{font-size:44px;opacity:.4;margin-bottom:12px}
/* ═══════════ 同步 ═══════════ */
.sync-field{margin-bottom:10px}
.sync-field label{
  display:block;font-size:12px;color:var(--muted);
  margin-bottom:6px;font-weight:600;letter-spacing:.3px;
}
.sync-field input{
  width:100%;padding:12px 14px;font-size:14px;
  border-radius:11px;border:1px solid var(--border);
  background:rgba(var(--text-rgb),.05);color:var(--text);
  font-family:inherit;outline:none;-webkit-appearance:none;
  transition:all .2s var(--ease);
}
.sync-field input:focus{
  border-color:var(--accent);background:rgba(var(--text-rgb),.08);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16);
}
.sync-hint{
  font-size:11.5px;color:var(--muted);line-height:1.6;
  padding:10px 12px;border-radius:10px;
  background:rgba(var(--accent-rgb),.06);
  border-left:3px solid var(--accent);margin-bottom:10px;
}
.sync-hint b{color:var(--accent)}
.sync-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sync-actions .btn{padding:12px;font-size:13.5px;min-height:46px}
.sync-status{
  padding:12px 14px;border-radius:11px;font-size:13px;
  background:rgba(var(--text-rgb),.04);border:1px solid var(--border);
  color:var(--muted);line-height:1.7;
}
.sync-status.ok{border-color:rgba(61,220,151,.4);color:#3ddc97}
.sync-status.err{border-color:rgba(255,107,129,.4);color:#ff6b81}
.sync-status.warn{border-color:rgba(255,180,60,.4);color:#ffb43c}
.sync-progress{
  margin-top:10px;font-size:12px;color:var(--muted);text-align:center;
  font-variant-numeric:tabular-nums;
}
.sync-progress-wrap{margin-top:10px}
.sync-progress-wrap[hidden]{display:none!important}
.sync-progress-bar{
  height:6px;border-radius:99px;
  background:rgba(var(--text-rgb),.08);overflow:hidden;position:relative;
}
.sync-progress-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .3s var(--ease);
}
.sync-progress-text{
  font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px;
  font-variant-numeric:tabular-nums;
}

/* ═══════════ 智能配图 ═══════════ */
.smart-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  max-height:48vh;overflow-y:auto;padding:3px;
}
.smart-grid .pick{
  position:relative;border:2px solid transparent;border-radius:12px;
  background:rgba(var(--text-rgb),.05);padding:0;cursor:pointer;overflow:hidden;
  aspect-ratio:1;transition:all .22s var(--ease);font-family:inherit;
}
.smart-grid .pick img{width:100%;height:100%;object-fit:cover;display:block}
.smart-grid .pick:active{transform:scale(.96)}
.smart-empty{
  grid-column:1/-1;text-align:center;padding:36px 12px;color:var(--muted);
  font-size:13px;line-height:1.8;
}

/* ═══════════ Toast ═══════════ */
#toasts{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 16px);
  z-index:9999;display:flex;flex-direction:column-reverse;gap:8px;
  align-items:center;pointer-events:none;
  width:max-content;max-width:92vw;
}
.toast{
  padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  background:rgba(var(--surface-rgb),.96);border:1px solid var(--border);
  backdrop-filter:blur(18px);box-shadow:0 14px 34px -12px rgba(0,0,0,.85);
  animation:toastIn .3s var(--ease);text-align:center;
  max-width:92vw;
}
.toast.ok{border-color:rgba(61,220,151,.4);color:#3ddc97}
.toast.warn{border-color:rgba(255,180,60,.4);color:#ffb43c}
.toast.err{border-color:rgba(255,107,129,.4);color:#ff6b81}
.toast.out{animation:toastOut .3s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.92)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(14px) scale(.94)}}

/* ═══════════ 透明玻璃主题（墨绿磨砂玻璃） ═══════════ */
body.theme-glass{
  --blur:32px;
}

/* 环境光晕：墨绿 + 青绿，替换默认的紫青 */
body.theme-glass::before{
  background:
    radial-gradient(760px 480px at 8% -8%, rgba(45,212,120,.22), transparent 65%),
    radial-gradient(640px 420px at 100% 6%, rgba(34,211,160,.18), transparent 65%),
    radial-gradient(720px 640px at 50% 112%, rgba(20,100,60,.18), transparent 62%) !important;
}

/* 玻璃卡片：半透明 + 强模糊 + 内高光边 */
body.theme-glass .topbar,
body.theme-glass .card,
body.theme-glass .quiz-card,
body.theme-glass .ring-card,
body.theme-glass .test-entry,
body.theme-glass .test-entry-card,
body.theme-glass .learn-card,
body.theme-glass .word-item,
body.theme-glass .lk-card,
body.theme-glass .resume-banner,
body.theme-glass .modal-box,
body.theme-glass .word-sheet{
  background:rgba(18,36,28,.42) !important;
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-color:rgba(160,255,200,.14) !important;
  box-shadow:
    0 22px 48px -20px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(180,255,215,.09) !important;
}

/* 顶部栏：稍实一点，避免内容透底 */
body.theme-glass .topbar{
  background:rgba(12,28,22,.72) !important;
}

/* 底部导航：也稍实一点 */
body.theme-glass .tabbar{
  background:rgba(12,28,22,.88) !important;
  border-top-color:rgba(160,255,200,.14) !important;
}

/* 弹窗底板：更实，内容清楚 */
body.theme-glass .modal-box{
  background:rgba(14,30,24,.88) !important;
  backdrop-filter:blur(40px) saturate(190%);
  -webkit-backdrop-filter:blur(40px) saturate(190%);
}

/* 底部抽屉详情：稍实 */
body.theme-glass .word-sheet{
  background:rgba(10,22,17,.94) !important;
}

/* 输入框 / 选项：深绿半透 */
body.theme-glass .input,
body.theme-glass .meaning-input,
body.theme-glass .pos-select,
body.theme-glass .lookup-input,
body.theme-glass .spell-input-bare,
body.theme-glass .choice-opt,
body.theme-glass .stage-btn,
body.theme-glass .set-btn,
body.theme-glass .theme-btn,
body.theme-glass .alpha,
body.theme-glass .sync-field input,
body.theme-glass .lib-filters select{
  background:rgba(8,22,16,.55) !important;
  border-color:rgba(160,255,200,.12) !important;
}

/* 次要按钮 / 图标按钮：玻璃质感 */
body.theme-glass .btn:not(.primary),
body.theme-glass .icon-btn{
  background:rgba(160,255,200,.06) !important;
  border-color:rgba(160,255,200,.14) !important;
}

/* 主按钮：绿青渐变，替换紫青 */
body.theme-glass .btn.primary{
  background:linear-gradient(135deg,#2dd4bf,#22c55e) !important;
  box-shadow:0 8px 22px -10px rgba(34,197,94,.9) !important;
}

/* 底栏选中态：绿色高光 */
body.theme-glass .tab.active{
  color:#6ee7b7;
}
body.theme-glass .tab.active::before{
  background:linear-gradient(90deg,#34d399,#22d3ee);
  box-shadow:0 2px 14px rgba(52,211,153,.9);
}

/* 大标题 / 圆环数字：绿青渐变 */
body.theme-glass .ring-total,
body.theme-glass .quiz-word,
body.theme-glass .lkd-word,
body.theme-glass .te-count,
body.theme-glass .result-stat .pct,
body.theme-glass .learn-card .lc-badge{
  background:linear-gradient(135deg,#34d399,#22d3ee) !important;
  -webkit-background-clip:text !important;
  background-clip:text !important;
  color:transparent !important;
}

/* 卡片顶部的细高光线（磨砂玻璃边缘感） */
body.theme-glass .card,
body.theme-glass .quiz-card,
body.theme-glass .ring-card,
body.theme-glass .modal-box{
  position:relative;
}
body.theme-glass .card::after,
body.theme-glass .quiz-card::after,
body.theme-glass .ring-card::after,
body.theme-glass .modal-box::after{
  content:'';
  position:absolute;
  top:0;left:14%;right:14%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(190,255,215,.35),transparent);
  pointer-events:none;
  border-radius:inherit;
}
</style>
</head>
<body>

<!-- ═══════ 顶部栏 ═══════ -->
<header class="topbar">
  <div class="topbar-body">
    <h1 id="viewTitle">新建单词</h1>
    <p class="sub" id="viewSub">把一张图片和一个单词绑定起来</p>
  </div>
  <button class="icon-btn" id="btnExitTest" title="退出测试" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
    </svg>
  </button>
  <button class="icon-btn" id="btnCloudSync" title="云同步">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.5 19a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.6-1.6A4.5 4.5 0 0 0 6.5 19z"/>
      <path d="M12 12v6"/>
      <path d="m9 15 3-3 3 3"/>
    </svg>
  </button>
  <button class="icon-btn" id="btnRefresh" title="刷新">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>
      <path d="M21 3v5h-5"/>
    </svg>
  </button>
  <button class="icon-btn" id="btnStats" title="统计">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 20V10M12 20V4M19 20v-8"/>
    </svg>
  </button>
  <button class="icon-btn" id="btnSettings" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
    </svg>
  </button>
</header>

<!-- ═══════ 内容区 ═══════ -->
<main class="content">

  <!-- 新建单词 -->
  <section class="view active" id="view-create">

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px">
        <h3 style="margin:0">单词信息</h3>
        <button type="button" class="btn primary" id="btnSaveWordTop"
                style="padding:0 14px;flex-shrink:0">💾 保存</button>
      </div>

      <label>英文单词</label>
      <div style="display:flex;gap:8px;align-items:stretch">
        <input class="input" id="cwText" placeholder="例如：serendipity"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="flex:1">
        <button type="button" class="btn" id="btnDictFill" style="flex-shrink:0;padding:0 14px">📖 查词</button>
      </div>

    </div>

    <div class="card">
      <h3>绑定图片</h3>
      <p class="muted" style="font-size:12.5px;margin-bottom:12px">
        从相册选图，或直接拍一张。图片会自动压缩。
      </p>
      <div id="createImgGrid" class="img-grid"></div>
      <div class="img-actions">
        <button type="button" class="btn" id="btnPickPhotos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2.5"/>
            <circle cx="8.5" cy="9.5" r="1.6"/>
            <path d="M4 17l5-5 4 4 3-3 4 4"/>
          </svg>
          从相册选
        </button>
        <button type="button" class="btn" id="btnTakePhoto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          拍照
        </button>
      </div>
      <button type="button" class="btn block" id="btnSmartImage" style="margin-top:10px">🌐 智能配图</button>
      <input id="photoInput" type="file" accept="image/*" multiple hidden>
      <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
    </div>

    <div class="card">
      <h3>例句</h3>
      <p class="muted" style="font-size:12.5px;margin-bottom:10px">
        点下面的按钮，让 AI 看着图片造一句话。
      </p>
      <button type="button" class="btn block" id="btnGenSentence"
              style="margin-bottom:8px;font-size:13.5px;min-height:42px;border-style:dashed">
        AI图片生例句
      </button>
      <textarea class="input" id="cwSentence" rows="2"
                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                style="resize:vertical;height:76px;min-height:76px;font-family:inherit;line-height:1.5"></textarea>
    </div>

    <div class="card">
      <h3>单词信息</h3>
      <label>中文释义</label>
      <div id="meaningsList" class="meanings-list"></div>
      <button type="button" class="btn block" id="btnAddMeaning"
              style="border-style:dashed;color:var(--muted);font-size:13.5px;min-height:42px">
        ＋ 添加意思
      </button>

      <label>音标（可选）</label>
      <input class="input" id="cwPhonetic" placeholder="/ˌserənˈdɪpəti/"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

      <label>分类（可选）</label>
      <input class="input" id="cwCategory" placeholder="例如：雅思核心"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <button class="btn primary block lg" id="btnSaveWord">保存到词库</button>

  </section>

  <!-- 总词库 -->
  <section class="view" id="view-library">
    <div class="lib-toolbar">
      <input class="lib-search lookup-input" id="libSearch" placeholder="搜索单词或中文意思…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             style="padding-right:16px">
      <div class="lib-filters">
        <select id="libCat"><option value="all">全部分类</option></select>
        <select id="libSort">
          <option value="new">最新添加</option>
          <option value="old">最早上传</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="weak">记忆最弱</option>
        </select>
      </div>
      <div class="alpha-bar" id="alphaBar"></div>
    </div>
    <div class="word-list" id="wordList"></div>
    <div class="lib-empty" id="libEmpty" hidden>
      <div class="big">📚</div>
      这里还没有单词<br>
      <span style="font-size:12.5px">去「新建」页添加第一个，或者用「查词」把词典里的词加进来</span>
    </div>
  </section>

  <!-- 测试 -->
  <section class="view" id="view-test">

    <!-- 测试首页：学习 / 复习 -->
    <div id="testSetup">
      <div class="resume-banner" id="resumeBannerLearn" hidden>
        <div class="rb-body">
          <div class="rb-title">继续学习</div>
          <div class="rb-sub" id="resumeBannerLearnSub"></div>
        </div>
        <button type="button" class="rb-btn ghost" data-banner-action="discard" data-banner-mode="learn">放弃</button>
        <button type="button" class="rb-btn" data-banner-action="continue" data-banner-mode="learn">继续</button>
      </div>
      <div class="resume-banner" id="resumeBannerReview" hidden>
        <div class="rb-body">
          <div class="rb-title">继续复习</div>
          <div class="rb-sub" id="resumeBannerReviewSub"></div>
        </div>
        <button type="button" class="rb-btn ghost" data-banner-action="discard" data-banner-mode="review">放弃</button>
        <button type="button" class="rb-btn" data-banner-action="continue" data-banner-mode="review">继续</button>
      </div>

      <!-- 词库可视化圆环 -->
      <div class="ring-card">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="gradLearned" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" style="stop-color:var(--accent)"/>
                <stop offset="100%" style="stop-color:var(--accent2)"/>
              </linearGradient>
              <linearGradient id="gradReview" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" style="stop-color:#ffd166"/>
                <stop offset="100%" style="stop-color:#ff8b3d"/>
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="100" cy="100" r="78"/>
            <circle class="ring-seg ring-seg-learned" id="ringSegLearned" cx="100" cy="100" r="78" stroke="url(#gradLearned)" stroke-dasharray="0 490.09"/>
            <circle class="ring-seg ring-seg-review"  id="ringSegReview"  cx="100" cy="100" r="78" stroke="url(#gradReview)"  stroke-dasharray="0 490.09"/>
            <circle class="ring-seg ring-seg-new"     id="ringSegNew"     cx="100" cy="100" r="78" stroke="rgba(140,140,160,.28)" stroke-dasharray="0 490.09"/>
          </svg>
          <div class="ring-center">
            <div class="ring-total" id="ringTotal">0</div>
            <div class="ring-total-label">总词数</div>
          </div>
        </div>
        <div class="ring-legend">
          <div class="legend-item">
            <div class="legend-num" id="ringLearnedNum">0</div>
            <div class="legend-name"><span class="legend-dot learned"></span>已学习</div>
          </div>
          <div class="legend-item">
            <div class="legend-num" id="ringReviewNum">0</div>
            <div class="legend-name"><span class="legend-dot review"></span>待复习</div>
          </div>
          <div class="legend-item">
            <div class="legend-num" id="ringNewNum">0</div>
            <div class="legend-name"><span class="legend-dot new"></span>未学习</div>
          </div>
        </div>
      </div>

      <div class="test-spacer"></div>

      <div class="test-entry-grid">
        <button type="button" class="test-entry-card learn" id="btnStartLearn" disabled>
          <div class="te-label">Learn</div>
          <div class="te-count" id="learnCount">0</div>
          <div class="te-sub">未学习</div>
        </button>
        <button type="button" class="test-entry-card review" id="btnStartReview" disabled>
          <div class="te-label">Review</div>
          <div class="te-count" id="reviewCount">0</div>
          <div class="te-sub">待复习</div>
        </button>
      </div>
    </div>

    <!-- 测试进行中 -->
    <div id="testRun" hidden></div>

    <!-- 测试结果 -->
    <div id="testResult" hidden></div>

  </section>

  <!-- 查词 -->
  <section class="view" id="view-lookup">
    <div class="lookup-box">
      <input class="lookup-input" id="lookupInput"
             placeholder="搜索单词或中文…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="search">
      <button class="lookup-clear" id="lookupClear" hidden>✕</button>
      <button class="lookup-mode" id="lookupMode">词库</button>
    </div>
    <div id="lookupResult"></div>
  </section>

</main>

<!-- ═══════ 底部导航 ═══════ -->
<nav class="tabbar">
  <button class="tab active" data-view="create">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
    </svg>
    <span>新建</span>
  </button>
  <button class="tab" data-view="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 3v18"/>
    </svg>
    <span>词库</span>
  </button>
  <button class="tab" data-view="test">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>
    </svg>
    <span>测试</span>
  </button>
  <button class="tab" data-view="lookup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <span>查词</span>
  </button>
</nav>

<!-- ═══════ 数据统计弹窗 ═══════ -->
<div id="statsModal" class="modal" hidden>
  <div class="modal-box">
    <div class="close-bar"></div>
    <h3>数据统计</h3>
    <div id="statsBody"></div>
    <button class="btn block lg" id="statsClose" style="margin-top:20px">关闭</button>
  </div>
</div>

<!-- ═══════ 设置弹窗（主菜单） ═══════ -->
<div id="settingsModal" class="modal" hidden>
  <div class="modal-box">
    <div class="close-bar"></div>
    <h3>设置</h3>

    <!-- 1. 主题 -->
    <div class="set-section">
      <div class="set-title">🎨 主题</div>
      <button class="set-btn" id="btnOpenTheme">
        <span class="ico">🎨</span>
        <span class="body">外观主题
          <small id="themeStatusShort">暗色</small>
        </span>
      </button>
    </div>

    <!-- 2. 测试环节 -->
    <div class="set-section" style="margin-top:20px">
      <button class="set-btn" id="btnOpenStage">
        <span class="ico">📝</span>
        <span class="body">测试环节
          <small>选择要练习的题型</small>
        </span>
      </button>
    </div>

    <!-- 3. 接口设置 -->
    <div class="set-section" style="margin-top:20px">
      <div class="set-title">🔌 接口设置</div>
      <button class="set-btn" id="btnOpenDav">
        <span class="ico">☁️</span>
        <span class="body">坚果云同步接口
          <small id="davStatusShort">未配置</small>
        </span>
      </button>
      <button class="set-btn" id="btnOpenApihz">
        <span class="ico">📚</span>
        <span class="body">盒子词典
          <small id="apihzStatusShort">未配置</small>
        </span>
      </button>
      <button class="set-btn" id="btnOpenZhipu">
        <span class="ico">🤖</span>
        <span class="body">智谱 AI 例句生成
          <small id="zhipuStatusShort">未配置</small>
        </span>
      </button>
      <button class="set-btn" id="btnOpenImg">
        <span class="ico">🖼</span>
        <span class="body">智能配图
          <small id="imgStatusShort">未配置</small>
        </span>
      </button>
    </div>

    <!-- 4. 数据管理 -->
    <div class="set-section" style="margin-top:20px">
      <div class="set-title">💾 数据管理</div>
      <button class="set-btn" id="setExportLight">
        <span class="ico">📦</span>
        <span class="body">导出（轻量）</span>
      </button>
      <button class="set-btn" id="setExportFull">
        <span class="ico">🎁</span>
        <span class="body">导出（完整）</span>
      </button>
      <button class="set-btn" id="setImport">
        <span class="ico">📥</span>
        <span class="body">导入数据</span>
      </button>
    </div>

    <!-- 5. 危险操作 -->
    <div class="set-section" style="margin-top:20px">
      <div class="set-title">⚠️ 危险操作</div>
      <button class="set-btn warn" id="setClearData">
        <span class="ico">🗑</span>
        <span class="body">清空本地数据</span>
      </button>
    </div>

    <!-- 6. 概览 -->
    <button class="btn block lg" id="btnOpenOverview" style="background:#ff4d4f; color:#fff; border:none; margin-top:20px; margin-bottom:20px; font-size:16px; font-weight:700"> 概览</button>

    <button class="btn block lg" id="settingsClose">关闭</button>
  </div>
</div>

<!-- ═══════ 子设置弹窗 ═══════ -->
<div id="subModal" class="modal" hidden>
  <div class="modal-box" id="subModalBox">
    <div class="close-bar"></div>
    <h3 id="subModalTitle">标题</h3>
    <div id="subModalBody"></div>
  </div>
</div>

<!-- ═══════ 智能配图弹窗 ═══════ -->
<div id="smartImageModal" class="modal" hidden>
  <div class="modal-box">
    <div class="close-bar"></div>
    <h3>选择图片</h3>
    <p class="muted" id="smartImageTip" style="font-size:12.5px;margin-bottom:12px">正在搜索相关图片…</p>
    <div class="smart-grid" id="smartImageGrid"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn" id="smartImgRefresh" style="flex:1">🔄 换一批</button>
      <button class="btn" id="smartImgCancel" style="flex:1">取消</button>
    </div>
  </div>
</div>

<!-- ═══════ 词库详情弹窗 ═══════ -->
<div id="wordDetailModal" class="modal" hidden>
  <div class="modal-box">
    <div class="close-bar"></div>
    <div id="wordDetailBody"></div>
  </div>
</div>

<!-- ═══════ 查词详情弹窗 ═══════ -->
<div id="lookupDetailModal" class="modal" hidden>
  <div class="modal-box">
    <div class="close-bar"></div>
    <div id="lookupDetailBody"></div>
  </div>
</div>

<!-- ═══════ 通用列表弹窗（查看全部词组 / 例句） ═══════ -->
<div id="listModal" class="modal" hidden>
  <div class="modal-box">
    <div class="close-bar"></div>
    <h3 id="listModalTitle">列表</h3>
    <div id="listModalBody"></div>
    <button class="btn block lg" id="listModalClose" style="margin-top:16px">关闭</button>
  </div>
</div>

<!-- ═══════ 确认弹窗（是 / 否） ═══════ -->
<div id="confirmModal" class="modal" hidden>
  <div class="modal-box" style="max-width:400px">
    <h3 id="confirmTitle">确认</h3>
    <p id="confirmMsg" class="muted" style="font-size:13.5px;line-height:1.7;margin-bottom:18px"></p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn" id="confirmNo">否</button>
      <button class="btn primary" id="confirmYes">是</button>
    </div>
  </div>
</div>

<input id="globalImport" type="file" accept=".json,application/json" hidden>

<!-- 导入进度弹窗 -->
<div id="progressModal" class="modal" hidden>
  <div class="modal-box" style="max-width:400px">
    <h3 style="text-align:center;margin-bottom:14px">正在导入…</h3>
    <div class="sync-progress-bar"><i id="progressFill" style="width:0%"></i></div>
    <div class="sync-progress-text" id="progressText">准备中…</div>
  </div>

/* ══════════════════════════════════════════════
   §1  工具函数
   ══════════════════════════════════════════════ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const nowMs = () => Date.now();
const DAY = 864e5;

function hexToRgb(hex) {
  hex = String(hex).replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const n = parseInt(hex, 16);
  return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
}

function timeAgo(ts) {
  const d = nowMs() - ts;
  if (d < 60e3) return '刚刚';
  if (d < 3600e3) return Math.floor(d / 60e3) + ' 分钟前';
  if (d < DAY) return Math.floor(d / 3600e3) + ' 小时前';
  if (d < 30 * DAY) return Math.floor(d / DAY) + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, 2400);
}

function download(content, filename, type = 'application/json') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
